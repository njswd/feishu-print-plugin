<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>排版打印 · 对标官方界面版</title>
<style>
  :root{
    --ink:#1f2329; --sub:#646a73; --line:#e5e6eb; --blue:#3370ff;
    --blue-bg:#f0f4ff; --card:#f7f8fa; --danger:#d83931; --green:#0f8a4d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:var(--ink); font-size:14px; background:#eef0f3; overflow:hidden;}

  /* ===== 整体布局 ===== */
  .app{display:flex; height:100%;}
  .side{width:250px; flex-shrink:0; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column;}
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .content{flex:1; overflow:auto; padding:24px; background:#e2e5ea;}

  /* ===== 左侧模板面板 ===== */
  .side-search{padding:12px 12px 6px;}
  .side-search input{width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;}
  .side-scroll{flex:1; overflow-y:auto; padding:4px 12px;}
  .group-title{font-size:12px; color:var(--sub); margin:12px 0 6px; font-weight:600;}
  .tpl-item{display:flex; align-items:center; gap:7px; padding:7px 9px; border-radius:7px; font-size:13px; cursor:pointer; margin-bottom:2px;}
  .tpl-item:hover{background:var(--card);}
  .tpl-item.on{background:var(--blue-bg); color:var(--blue); font-weight:600;}
  .tpl-item .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tpl-item .del{font-size:11px; color:var(--sub); border:none; background:none; cursor:pointer; display:none;}
  .tpl-item:hover .del{display:block;}
  .tpl-item .del:hover{color:var(--danger);}
  .side-foot{padding:10px 12px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px;}
  .btn-create{width:100%; background:var(--blue); color:#fff; border:none; padding:9px; border-radius:8px; font-size:13.5px; cursor:pointer; font-weight:600;}
  .btn-create:hover{background:#2860e1;}
  .side-empty{font-size:12px; color:#a0a6b0; padding:4px 9px 8px;}

  /* ===== 顶部操作栏 ===== */
  .topbar{height:46px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; padding:0 14px; flex-shrink:0;}
  .topbar .sep{border-left:1px solid var(--line); height:20px; margin:0 4px;}
  .topbar select{padding:4px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; max-width:170px;}
  .paper-chip{font-size:12.5px; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 9px; cursor:pointer; background:#fff;}
  .paper-chip:hover{border-color:var(--blue); color:var(--blue);}
  .rec-chip{font-size:12.5px; color:var(--sub); white-space:nowrap;}
  .rec-chip b{color:var(--ink); font-weight:600;}
  .link-btn{border:none; background:none; color:var(--blue); font-size:12.5px; cursor:pointer; padding:4px 8px; white-space:nowrap;}
  .link-btn:hover{text-decoration:underline;}
  .link-btn.batch-on{color:#fff; background:var(--green); border-radius:6px; text-decoration:none;}
  .tb-btn{border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 13px; font-size:13px; cursor:pointer; white-space:nowrap;}
  .tb-btn:hover{border-color:var(--blue); color:var(--blue);}
  .tb-btn.primary{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
  .tb-btn.primary:hover{background:#2860e1;}
  .save-hint{font-size:11.5px; color:#a0a6b0;}

  /* ===== 纸张设置弹出 ===== */
  .pop-wrap{position:relative;}
  .popover{position:absolute; top:36px; left:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.14); padding:12px; width:230px; z-index:50; display:none;}
  .popover.show{display:block;}
  .popover label{font-size:11px; color:var(--sub); display:block; margin:7px 0 2px;}
  .popover select,.popover input{width:100%; padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px;}
  .popover .row2{display:flex; gap:6px;}

  /* ===== 纸张与元素 ===== */
  .paper{background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.15); position:relative; margin:0 auto 24px; overflow:hidden;}
  .paper-label{position:absolute; top:5px; right:10px; font-size:11px; color:#c0c4cc; z-index:1;}
  .el{position:absolute; cursor:move; user-select:none;}
  .el.selected{outline:2px solid var(--blue); outline-offset:1px;}
  .el .content{width:100%; height:100%; overflow:hidden; pointer-events:none; padding:0; flex:none; background:transparent;}
  .el .content.editable{pointer-events:auto;}
  /* v1.4 修复：自动表格内容区恢复可点击（否则 chip/列头/＋ 全部点击穿透，气泡弹不出） */
  .el .content.el-autotable{pointer-events:auto;}
  .el .content[contenteditable]:focus{outline:1px dashed var(--blue);}
  .resize-handle{position:absolute; right:-5px; bottom:-5px; width:10px; height:10px; background:var(--blue); border:2px solid #fff; border-radius:50%; cursor:nwse-resize; display:none; z-index:5;}
  .el.selected .resize-handle{display:block;}
  /* ===== v1.5.1 拖动实时排版预览：重叠时显示重排式样虚线框 ===== */
  #ghostLayer{position:absolute; left:0; top:0; right:0; bottom:0; pointer-events:none; z-index:60;}
  #ghostLayer .ghost-el{position:absolute; border:1.5px dashed var(--blue); background:rgba(51,112,255,.07); border-radius:3px; box-sizing:border-box;}
  #ghostLayer .ghost-el.active{border-style:solid; background:rgba(51,112,255,.14); box-shadow:0 2px 10px rgba(51,112,255,.25);}
  /* v1.5.2 同行顶部吸附对齐参考线 */
  #ghostLayer .ghost-refline{position:absolute; height:0; border-top:2px solid #f54a45; box-shadow:0 0 4px rgba(245,74,69,.5);}
  .el-text .content{line-height:1.6; word-break:break-all; white-space:pre-wrap;}
  .el-line{border-top:1.5px solid #333;}
  .el-table table{width:100%; height:100%; border-collapse:collapse;}
  .el-table td,.el-table th{border:1px solid #444; padding:2px 4px; font-size:12px;}
  .el-autotable table{width:100%; border-collapse:collapse;}
  .el-autotable td,.el-autotable th{border:1px solid #444; padding:3px 5px; font-size:12px; text-align:left;}
  .el-autotable th{background:#f2f2f2;}
  /* v1.1 自动表格列字段关联：编辑态数据行 chip + 列尾添加按钮 */
  .el-autotable th.at-add{cursor:pointer; text-align:center; color:#3370ff; background:#f0f4ff; font-weight:400; width:34px;}
  .el-autotable th.at-add:hover{background:#e1eaff;}
  .el-autotable .at-chip{cursor:pointer;}
  /* v1.3 编辑列对话框：列头 th 可点击 */
  .el-autotable th.at-th{cursor:pointer;}
  .el-autotable th.at-th:hover{background:#e1eaff;}
  .fm-form{padding:12px 16px 0; display:flex; align-items:center; gap:10px;}
  .fm-form label{font-size:12px; color:#4e5969; flex:none;}
  .fm-form input{flex:1;}
  .fm-foot{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-top:1px solid #f0f1f3;}
  .fm-delcol{border:none; background:none; color:#f0473f; font-size:12px; cursor:pointer; padding:6px 8px; border-radius:6px;}
  .fm-delcol:hover{background:#ffece8;}
  .fm-ok{border:none; background:var(--blue); color:#fff; font-size:13px; cursor:pointer; padding:7px 22px; border-radius:6px; margin-left:auto;}
  .fm-ok:hover{opacity:.9;}
  .fm-item.active{background:#e8f0ff;}
  .fm-item.active b{color:var(--blue);}
  .el-img img{width:100%; height:100%; object-fit:contain;}
  .el-qr,.el-bar{background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .qr-box img{width:100%; height:100%;}
  .lib-fallback{font-size:10.5px; color:#999; text-align:center; padding:4px;}
  .el .el-sign{display:flex; align-items:center; justify-content:center;}
  .sign-zone{width:100%; height:100%; border:1.5px dashed #999; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#999; font-size:11px;}
  .sign-zone img{width:100%; height:100%; object-fit:contain;}

  /* ===== v0.6 编辑器（对齐官方）===== */
  .name-input{border:1px solid transparent; background:transparent; font-size:13px; font-weight:600; padding:4px 8px; border-radius:6px; width:170px; color:var(--ink);}
  .name-input:hover{background:var(--card);}
  .name-input:focus{outline:none; border-color:var(--blue); background:#fff;}
  .tb-btn:disabled{opacity:.35; cursor:not-allowed;}
  .tb-btn:disabled:hover{border-color:var(--line); color:var(--ink);}
  .tip-box{background:#fff8e6; color:#8a6116; font-size:11.5px; line-height:1.5; border-radius:8px; padding:8px 10px; margin:2px 0 10px;}
  .comp-list{display:flex; flex-direction:column; gap:4px;}
  .comp-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; font-size:13px; cursor:grab; user-select:none; border:1px solid transparent;}
  .comp-item:hover{background:var(--card); border-color:var(--line);}
  .comp-item .ic{width:20px; text-align:center;}
  .canvas-top{display:flex; align-items:center; gap:6px; padding:0 0 10px; font-size:11.5px; color:#a0a6b0;}
  .more-btn{border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer; color:var(--sub); white-space:nowrap;}
  .more-btn:hover{border-color:var(--blue); color:var(--blue);}
  .popover.right{left:auto; right:0;}
  .pop-item{display:block; width:100%; text-align:left; border:none; background:none; padding:7px 8px; font-size:12.5px; cursor:pointer; border-radius:6px; color:var(--ink);}
  .pop-item:hover{background:var(--card);}
  .fld-chip{display:inline-block; border:1px solid #f0473f; color:#f0473f; background:#fff7f6; border-radius:4px; padding:0 4px; margin:0 1px; font-size:.9em; line-height:1.5; white-space:nowrap;}
  .chip-caret{font-style:normal; opacity:.65; font-size:.85em;}
  .grow{flex:1;}

  /* ===== v0.7 浮动工具条 + 拖动手柄 ===== */
  .float-bar{position:absolute; z-index:20;}
  .fb-wrap{position:relative; display:flex; align-items:center; gap:2px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.14); padding:3px;}
  .fb-btn{border:none; background:none; padding:4px 8px; font-size:12px; cursor:pointer; border-radius:6px; white-space:nowrap; color:var(--ink);}
  .fb-btn:hover{background:var(--card);}
  .fb-btn.fb-del:hover{background:#fff1f0; color:var(--danger);}
  .fb-pop{position:absolute; top:34px; left:0; display:none; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.14); padding:6px; z-index:30; min-width:110px;}
  .fb-pop.show{display:block;}
  .fb-pop .mi{display:block; width:100%; text-align:left; border:none; background:none; padding:6px 9px; font-size:12px; cursor:pointer; border-radius:5px; color:var(--ink); white-space:nowrap;}
  .fb-pop .mi:hover{background:var(--card);}
  .fb-pos{min-width:160px; padding:8px;}
  .fb-pos.show{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .fb-pos label{font-size:10.5px; color:var(--sub); display:block;}
  .fb-pos input{width:100%; padding:3px 6px; border:1px solid var(--line); border-radius:5px; font-size:12px;}
  .drag-handle{
    position:absolute; left:-8mm; top:0; width:6mm; height:6mm;
    display:none; align-items:center; justify-content:center;
    background:#fff; border:1px solid var(--blue); color:var(--blue);
    border-radius:4px; cursor:grab; font-size:11px; z-index:6;
    box-shadow:0 1px 4px rgba(0,0,0,.15); user-select:none;
  }
  .el.selected .drag-handle{display:flex;}

  /* ===== v0.8 字段 chip 气泡 + 更换字段对话框 ===== */
  .chip-pop{
    position:absolute; z-index:40; display:flex; align-items:center; gap:4px; flex-wrap:wrap;
    background:#1f2329; color:#fff; border-radius:8px; padding:6px 8px;
    box-shadow:0 4px 16px rgba(0,0,0,.25); white-space:nowrap;
  }
  .cp-name{font-size:12px; font-weight:600; margin-right:2px; max-width:180px; overflow:hidden; text-overflow:ellipsis;}
  .cp-btn{border:none; background:rgba(255,255,255,.14); color:#fff; font-size:11.5px; padding:3px 8px; border-radius:5px; cursor:pointer;}
  .cp-btn:hover{background:rgba(255,255,255,.28);}
  /* v1.4 自动表格 chip 气泡：字段状态警告行 */
  .atp-warn{flex-basis:100%; font-size:11px; color:#ffb84d; padding-top:2px; white-space:normal;}
  .fld-chip{cursor:pointer;}
  /* v0.9 字段 chip 数据关联状态：蓝=可取数，红=取不到 */
  .fld-chip.chip-ok{border-color:#3370ff; color:#3370ff; background:#f0f6ff;}
  .fld-chip.chip-bad{border-color:#f0473f; color:#f0473f; background:#fff7f6;}
  .field-modal{width:420px; padding:0; overflow:hidden;}
  .fm-head{display:flex; align-items:center; justify-content:center; position:relative; padding:14px; font-size:14px; font-weight:600; border-bottom:1px solid var(--line);}
  .fm-close{position:absolute; right:12px; top:11px; border:none; background:none; font-size:14px; cursor:pointer; color:var(--sub);}
  .fm-close:hover{color:var(--ink);}
  .fm-search{display:block; width:calc(100% - 32px); margin:12px 16px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px;}
  .fm-list{max-height:380px; overflow-y:auto; padding-bottom:8px;}
  .fm-item{display:flex; align-items:center; gap:12px; padding:10px 16px; cursor:pointer;}
  .fm-item:hover{background:var(--card);}
  .fm-ic{width:22px; text-align:center; font-size:15px; color:var(--sub);}
  .fm-txt{display:flex; flex-direction:column; line-height:1.4;}
  .fm-txt b{font-size:13.5px; font-weight:500;}
  .fm-txt i{font-style:normal; font-size:11px; color:#a0a6b0;}

  /* ===== v1.0 编辑态侧栏：图标栏 + 可切换面板 ===== */
  .side-body{flex:1; display:flex; min-height:0;}
  .icon-rail{width:46px; border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding-top:10px; gap:4px; flex-shrink:0;}
  .rail-btn{width:34px; height:34px; border:none; background:none; border-radius:8px; cursor:pointer; color:#646a73; display:flex; align-items:center; justify-content:center; padding:0;}
  .rail-btn:hover{background:var(--card);}
  .rail-btn.on{color:var(--blue); background:var(--blue-bg);}
  .rail-btn svg{width:19px; height:19px; display:block;}
  .panel-area{flex:1; min-width:0; display:flex; flex-direction:column;}
  .panel-scroll{flex:1; overflow-y:auto; padding:12px;}
  .panel-title{font-size:14px; font-weight:600; margin:2px 0 10px;}
  .comp-card{display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13px; cursor:grab; user-select:none; margin-bottom:7px; background:#fff;}
  .comp-card:hover{border-color:var(--blue); color:var(--blue); background:var(--blue-bg);}
  .comp-card .ic{font-size:15px; width:20px; text-align:center;}
  .ds-search{width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; margin-bottom:8px;}
  .ds-tabs{display:flex; gap:14px; border-bottom:1px solid var(--line); margin-bottom:9px;}
  .ds-tab{border:none; background:none; font-size:12.5px; padding:5px 2px; cursor:pointer; color:var(--sub); border-bottom:2px solid transparent;}
  .ds-tab.on{color:var(--blue); border-bottom-color:var(--blue); font-weight:600;}
  .ds-item{display:flex; align-items:center; gap:8px; border:1px solid #c9dcff; background:#f5f8ff; border-radius:8px; padding:8px 10px; font-size:12.5px; margin-bottom:6px; cursor:pointer; color:var(--ink);}
  .ds-item:hover{border-color:var(--blue);}
  .ds-item .ic{color:var(--blue); width:16px; text-align:center; font-size:12px; flex-shrink:0;}
  .ds-item .nm{overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .ds-item .cp{margin-left:auto; border:none; background:none; color:var(--blue); cursor:pointer; font-size:12px; padding:2px 5px; flex-shrink:0;}
  .ds-item .cp:hover{background:#e1eaff; border-radius:4px;}
  .loop-wrap{border:1px solid #ffd591; background:#fffaf0; border-radius:8px; padding:8px 10px; margin-bottom:6px;}
  .loop-head{display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer;}
  .loop-head .ic{color:#d48806;}
  .loop-fold{margin-left:auto; font-size:11px; color:#d48806; border:1px solid #ffd591; background:#fff; border-radius:4px; padding:1px 6px; flex-shrink:0;}
  .loop-sub{margin:6px 0 0 22px;}
  .loop-sub .ds-item{background:#fff; margin-bottom:5px;}
  .ps-sec{font-size:12.5px; font-weight:600; margin:13px 0 7px;}
  .ps-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .ps-grid label{font-size:10.5px; color:var(--sub); display:block; margin-bottom:2px;}
  .ps-grid input,.ps-grid select{width:100%; padding:5px 7px; border:1px solid var(--line); border-radius:6px; font-size:12px; background:#fff; box-sizing:border-box;}
  .ps-row{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; padding:7px 0; gap:8px;}
  .ps-row .hint{color:#a0a6b0; font-size:11px;}
  .sw{position:relative; width:34px; height:19px; flex-shrink:0; display:inline-block;}
  .sw input{opacity:0; width:0; height:0;}
  .sw i{position:absolute; inset:0; background:#d8dadf; border-radius:99px; transition:.15s; cursor:pointer;}
  .sw i:before{content:""; position:absolute; width:15px; height:15px; border-radius:50%; background:#fff; top:2px; left:2px; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .sw input:checked + i{background:var(--blue);}
  .sw input:checked + i:before{left:17px;}
  .wm-radio{display:flex; flex-direction:column; gap:6px; font-size:12.5px; margin-bottom:7px;}
  .insp-page{border:1px dashed #b8c6ff; background:#f7f9ff; border-radius:8px; padding:8px; margin-bottom:4px;}
  .insp-page-head{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--sub); padding:0 2px 6px;}
  .insp-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px;}
  .insp-el{border:1px solid #91bfff; background:#eef4ff; color:#1f5fd0; border-radius:6px; font-size:11.5px; padding:6px 8px; cursor:pointer; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .insp-el:hover{background:#e1eaff;}
  .insp-el.on{background:#d6e6ff; border-color:#3370ff; font-weight:600;}
  .insp-el.wide{grid-column:1 / -1;}
  .fold{border-top:1px solid var(--line); margin-top:10px;}
  .fold summary{font-size:12.5px; font-weight:600; padding:9px 2px; cursor:pointer; color:var(--ink); list-style:none;}
  .fold summary::-webkit-details-marker{display:none;}
  .fold summary:before{content:"▸ ";}
  .fold[open] summary:before{content:"▾ ";}
  .fold .fold-body{padding:2px 2px 10px;}
  .wm-layer{position:absolute; inset:0; pointer-events:none; z-index:0; overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .wm-layer span{transform:rotate(-22deg); font-size:44px; font-weight:700; color:rgba(31,35,41,.07); white-space:nowrap; letter-spacing:6px;}

  /* ===== 编辑模式左侧 ===== */
  .ed-sec{padding:0 12px;}
  .sec-title{font-size:12px; color:var(--sub); margin:12px 0 6px; font-weight:600;}
  .palette{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .pal-item{border:1px solid var(--line); border-radius:8px; padding:8px 4px; text-align:center; font-size:12.5px; cursor:grab; background:#fff; user-select:none;}
  .pal-item:hover{border-color:var(--blue); color:var(--blue); background:var(--blue-bg);}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-size:11px; background:var(--blue-bg); color:var(--blue); border:none; padding:3px 8px; border-radius:99px; cursor:pointer;}
  .prop-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px;}
  .prop-grid label{font-size:10.5px; color:var(--sub); display:block;}
  .prop-grid input,.prop-grid select{width:100%; padding:3px 6px; border:1px solid var(--line); border-radius:5px; font-size:12px;}
  .props textarea{width:100%; height:56px; padding:5px; border:1px solid var(--line); border-radius:5px; font-size:12px; font-family:inherit; resize:vertical;}
  .btn-sm{border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px; font-size:12px; cursor:pointer; width:100%; margin-top:6px;}
  .btn-sm.on{border-color:var(--blue); color:var(--blue); background:var(--blue-bg); font-weight:600;}

}

/* =====================================================================

var SAVE_KEY = "print-plugin-layout-v4";
function saveState(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      templates: state.templates, currentTpl: state.currentTpl, autoFields: state.autoFields,
      paper: state.paper, landscape: state.landscape, margin: state.margin, perPage: state.perPage,
      margins: state.margins, pgSet: state.pgSet, appSet: state.appSet
    }));
  }catch(e){}
}
function loadState(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d.templates && d.templates.length){
      state.templates = d.templates;
      state.currentTpl = d.currentTpl || d.templates[0].id;
    }
    if(d.autoFields) state.autoFields = d.autoFields;
    if(d.paper) state.paper = d.paper;
    if(d.landscape) state.landscape = d.landscape;
    if(d.margin) state.margin = d.margin;
    if(d.perPage) state.perPage = d.perPage;
    /* v1.0 迁移：旧单一 margin → 四边；合并新设置项 */
    if(d.margins && typeof d.margins.t === "number") state.margins = d.margins;
    else if(d.margin) state.margins = { t:d.margin, r:d.margin, b:d.margin, l:d.margin };
    if(d.pgSet) state.pgSet = Object.assign(state.pgSet, d.pgSet);
    /* v1.5.1 一次性迁移：旧版默认 off → wrap（拖动实时预览开箱即用） */
    if(!localStorage.getItem("print-plugin-layout-v4.mig151")){
      localStorage.setItem("print-plugin-layout-v4.mig151", "1");
      state.pgSet.layoutMode = "wrap";
      saveState();
    }
    if(d.appSet) state.appSet = Object.assign(state.appSet, d.appSet);
    var max = 0;
    state.templates.forEach(function(t){ t.elements.forEach(function(e){ var n=parseInt(e.id.slice(1)); if(n>max) max=n; }); });

}

function renderTpl(tpl, data, rows){
  return String(tpl).replace(/\{\{(.*?)\}\}/g, function(_, raw){
    var m = raw.match(/^SUM\((.+)\)$/);
    if(m){
      var name = m[1].trim();
      var list = rows && rows.length ? rows : (data ? [data] : []);
      var sum = 0;
      list.forEach(function(r){ var n = parseFloat(r[name]); if(!isNaN(n)) sum += n; });
      return String(Math.round(sum * 100) / 100);
    }
    var v = data ? data[raw.trim()] : undefined;
    return (v === undefined || v === null) ? "" : String(v);
  });
}
/* 编辑态：把 {{字段}} 渲染为 chip（v0.9：能取到数据=蓝色，取不到=红色） */
function chipLabel(f){
  var m = f.match(/^SUM\((.+)\)$/);
  return m ? "求和 · " + m[1].trim() : f;
}
/* v0.9/v1.0 判断字段是否可取数（明细字段 + 系统字段；SUM 剥壳）——定义见下方 v1.0 面板区 */
function richEditHTML(raw){
  return esc(raw || "").replace(/\{\{(.*?)\}\}/g, function(_, f){
    var cls = fieldExists(f) ? "fld-chip chip-ok" : "fld-chip chip-bad";
    return '<span class="'+cls+'" data-raw="'+esc(f)+'"'+(fieldExists(f) ? '' : ' title="未找到字段"')+'>'+esc(chipLabel(f))+' <i class="chip-caret">⌄</i></span>';
  });
}
/* v0.9 预览态渲染：未知字段显示红色 chip，已知字段取值/求和（内部已转义） */
function renderTplHtml(tpl, data, rows){
  return esc(String(tpl || "")).replace(/\{\{(.*?)\}\}/g, function(_, f){
    if(!fieldExists(f)) return '<span class="fld-chip chip-bad" title="未找到字段">' + esc(chipLabel(f)) + '</span>';
    var m = f.match(/^SUM\((.+)\)$/);
    if(m){
      var name = m[1].trim();
      var list = rows && rows.length ? rows : (data ? [data] : []);
      var sum = 0;
      list.forEach(function(r){ var n = parseFloat(r[name]); if(!isNaN(n)) sum += n; });
      return esc(String(Math.round(sum * 100) / 100));
    }
    var key = f.trim();
    var v = data && data[key] !== undefined ? data[key] : SYS_DATA[key];
    return (v === undefined || v === null) ? "" : esc(String(v));
  });
}
/* 退出编辑时把 DOM 还原为原始文本（chip → {{字段}}） */
function richToRaw(node){
  var out = "";
  node.childNodes.forEach(function(n){
    if(n.nodeType === 3){ out += n.nodeValue || ""; }
    else if(n.nodeType === 1){
      var el = n;
      if(el.classList.contains("fld-chip")){ out += "{{" + (el.getAttribute("data-raw") || el.textContent) + "}}"; }
      else if(el.tagName === "BR"){ out += "\n"; }
      else if(el.tagName === "DIV" || el.tagName === "P"){ out += (out ? "\n" : "") + richToRaw(el); }
      else { out += richToRaw(el); }
    }
  });
  return out;
}
function renderElContent(el, data, rows, edit){
  var p = el.props || {};
  var style = "font-size:" + (p.fontSize || 14) + "px;" + (p.bold ? "font-weight:700;" : "") + "text-align:" + (p.align || "left") + ";";
  switch(el.type){
    case "text":
    case "free":
    case "article":
    case "attach":
      if(edit) return '<div class="content editable" style="'+style+'">' + richEditHTML(p.content || "") + "</div>";
      return '<div class="content" style="'+style+'">' + renderTplHtml(p.content || "", data, rows) + "</div>";
    case "line":
      return '<div class="content el-line"></div>';
    case "image":
      return '<div class="content el-img"><img src="'+esc(p.src||"")+'" alt=""></div>';
    case "qrcode":
      return '<div class="content el-qr" data-qr="'+esc(p.content||"")+'"></div>';
    case "barcode":
      return '<div class="content el-bar" data-bar="'+esc(p.content||"")+'"></div>';
    case "sign":
      if(p.src) return '<div class="content el-sign"><div class="sign-zone"><img src="'+p.src+'"></div></div>';
      return '<div class="content el-sign"><div class="sign-zone">签名区</div></div>';
    case "table":
      var rows = p.rows||3, cols = p.cols||3, html = "<table>";
      for(var r=0;r<rows;r++){
        html += "<tr>";
        for(var c=0;c<cols;c++){
          var cell = (p.cells && p.cells[r] && p.cells[r][c]) || "";
          var cellHtml = edit ? richEditHTML(cell) : renderTplHtml(cell, data, rows);
          html += '<td style="text-align:'+(p.align||"left")+'">'+cellHtml+"</td>";
        }
        html += "</tr>";
      }
      return '<div class="content el-table" style="'+style+'">'+html+"</div>";
    case "autotable":
      var fs = autoFieldsOf(el); /* v1.3 列字段支持 per-element 关联，undefined 才 fallback 全局 */
      var titles = el.props.titles || []; /* v1.3 列头自定义文字 */
      var head = "<tr>"+fs.map(function(f, ci){
          var th = edit
            ? '<th class="at-th" data-col="'+ci+'" title="点击编辑列">'+esc(titles[ci]||f)+'</th>'
            : "<th>"+esc(titles[ci]||f)+"</th>";
          return th;
        }).join("")
        + (edit ? '<th class="at-add" data-add="1" title="添加字段列">＋</th>' : "") + "</tr>";
      var body = RECORDS.slice(0,2).map(function(rec){
        return "<tr>"+fs.map(function(f, ci){
          var cell = edit
            ? '<span class="fld-chip chip-ok at-chip" data-col="'+ci+'" title="点击更改或删除此列">'+esc(f)+' <i class="chip-caret">⌄</i></span>'
            : esc(rec[f]||"");
          return "<td>"+cell+"</td>";
        }).join("")+"</tr>";
      }).join("");
      return '<div class="content el-autotable"><table>'+head+body+'<tr><td colspan="'+(fs.length+(edit?1:0))+'" style="color:#bbb;text-align:center">…预览时自动填入全部记录…</td></tr></table></div>';
  }
  return "";
}

/* =====================================================================
 * 分页逻辑
 * record 模板：单条=当前记录一页；批量=全部记录各一页
 * view 模板：含自动表格=按每页行数分页（元素每页重复）；否则单页
 * ===================================================================== */
function buildPageList(){
  var t = curTpl();
  var list = [];
  if(t.kind === "record"){
    if(state.batch){
      RECORDS.forEach(function(rec, i){ list.push({ data: rec, no: i+1 }); });
    }else{
      list.push({ data: curRec(), no: 1 });
    }
  }else{
    var hasAuto = t.elements.some(function(e){ return e.type === "autotable"; });
    if(hasAuto){
      for(var i=0;i<RECORDS.length;i+=state.perPage){
        list.push({ rows: RECORDS.slice(i, i+state.perPage), no: list.length+1 });
      }
      if(list.length===0) list.push({ rows: [], no: 1 });
    }else{
      list.push({ data: null, no: 1 });
    }
  }
  return list;
}

function buildPages(area){
  var dim = paperSizeMM();
  area.innerHTML = "";
  var pages = buildPageList();
  var total = pages.length;

  pages.forEach(function(pg){
    var paper = document.createElement("div");
    paper.className = "paper";
    paper.style.width = dim.w+"mm"; paper.style.height = dim.h+"mm"; paper.style.padding = padStr();
    paper.innerHTML = '<span class="paper-label">第 '+pg.no+" 页 / 共 "+total+" 页</span>" + wmHtml();

    els().forEach(function(el){
      var div = document.createElement("div");
      div.className = "el el-"+el.type;
      div.style.left = el.x+"mm"; div.style.top = el.y+"mm";
      div.style.width = el.w+"mm"; div.style.height = el.h+"mm";
      if(el.type === "autotable"){
        var fs = autoFieldsOf(el);
        var titles = el.props.titles || []; /* v1.3 列头自定义文字 */
        var rows = pg.rows || [];
        var html = "<table><tr>"+fs.map(function(f, ci){ return "<th>"+esc(titles[ci]||f)+"</th>"; }).join("")+"</tr>";
        rows.forEach(function(rec){
          html += "<tr>"+fs.map(function(f){ return "<td>"+esc(rec[f]||"")+"</td>"; }).join("")+"</tr>";
        });
        if(curTpl().kind === "view"){
          for(var pad=rows.length; pad<state.perPage; pad++){
            html += "<tr>"+fs.map(function(){ return "<td>&nbsp;</td>"; }).join("")+"</tr>";
          }
        }
        div.innerHTML = html + "</table>";
      }else{
        div.innerHTML = renderElContent(el, pg.data || null, pg.rows || [], false);
      }
      paper.appendChild(div);
    });
    area.appendChild(paper);
  });
  paintCodes(area);
}

/* ===== 撤销 / 重做 / 清空（v0.6）===== */
var hist = { stack: [], idx: -1 };
function resetHist(){ hist.stack = [JSON.stringify(els())]; hist.idx = 0; }
function commit(){
  var s = JSON.stringify(els());
  if(hist.stack[hist.idx] === s) return;
  hist.stack = hist.stack.slice(0, hist.idx + 1);
  hist.stack.push(s);
  if(hist.stack.length > 50) hist.stack.shift();
  hist.idx = hist.stack.length - 1;
}
function undo(){
  if(hist.idx <= 0) return;
  hist.idx--;
  curTpl().elements = JSON.parse(hist.stack[hist.idx]);
  state.selectedId = null;
  renderAll(); saveState();
}
function redo(){
  if(hist.idx >= hist.stack.length - 1) return;
  hist.idx++;
  curTpl().elements = JSON.parse(hist.stack[hist.idx]);
  state.selectedId = null;
  renderAll(); saveState();
}
function clearAll(){
  if(!els().length) return;
  if(!confirm("确定清空当前模板的所有元素？")) return;
  curTpl().elements = [];
  state.selectedId = null;
  commit(); renderAll(); saveState();
}

var dragType = null;
function bindElDrag(div, el){
  function startMove(ev){
    if(ev.target.classList.contains("resize-handle")) return;
    state.selectedId = el.id;
    ev.stopPropagation();
    document.querySelectorAll(".el.selected").forEach(function(n){ n.classList.remove("selected"); });
    div.classList.add("selected");
    buildFloatBar();
    renderProps();
    var startX = ev.clientX, startY = ev.clientY, ox = el.x, oy = el.y;
    function onMove(e){
      el.x = ox + (e.clientX-startX)/MM; el.y = oy + (e.clientY-startY)/MM;
      div.style.left = el.x+"mm"; div.style.top = el.y+"mm";
      moveFloatBar(el);
      /* v1.5.3 重叠 → 下落避让落位虚影；同行 → 顶部吸附线 */
      var p = calcEvade(el.x, el.y, el.w, el.h, el.id, true);
      if(p){ showGhostAlign({ x: p.x, y: p.y, w: el.w, h: el.h }, null); }
      else{
        var al = rowAlignCalc(el.id);
        if(al) showGhostAlign({ x: el.x, y: al.y, w: el.w, h: el.h }, al);
        else hideGhost();
      }
    }
    function onUp(){
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      hideGhost();
      var did = autoEvade(el, true); /* 重叠 → 下落避让（只动自己） */
      if(!did){
        var al = rowAlignCalc(el.id); /* 同行 → 顶部对齐吸附（对方不动） */
        if(al){ el.y = al.y; did = true; }
      }
      if(did) renderContent();
      commit(); saveState();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }
  div.addEventListener("mousedown", startMove);
  var dh = div.querySelector(".drag-handle");
  if(dh) dh.addEventListener("mousedown", startMove);
  var handle = div.querySelector(".resize-handle");
  if(handle){
    handle.addEventListener("mousedown", function(ev){
      ev.stopPropagation(); ev.preventDefault();
      var startX = ev.clientX, startY = ev.clientY, ow = el.w, oh = el.h;
      function onMove(e){
        el.w = Math.max(5, ow+(e.clientX-startX)/MM); el.h = Math.max(3, oh+(e.clientY-startY)/MM);
        div.style.width = el.w+"mm"; div.style.height = el.h+"mm";
        moveFloatBar(el);
      }
      function onUp(){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        hideGhost();
        if(autoEvade(el, false)) renderContent(); /* v1.5.3 缩放后重叠 → y 下落避让（x 不动） */
        commit(); saveState();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  }
}

function innerArea(){

  return { w: (state.landscape ? s[1] : s[0]) - state.margins.l - state.margins.r, h: (state.landscape ? s[0] : s[1]) - state.margins.t - state.margins.b };

/* ===== v1.5.3 自动排版（局部避让版）：重叠时只动被操作控件，其他控件保持原位 =====
   v1.5 全局装箱会把右上/居中控件全拉到左边（用户实测反馈），改为"下落避让"：
   被拖控件保持 x（wrap 模式）向下落到首个无重叠空位 = "自动换行"；
   cols2 模式 x 吸附近侧列后下落 = "排成两列"。 */
function overlapsAnyAt(x, y, w, h, skipId){
  var list = els();
  for(var i = 0; i < list.length; i++){
    var e = list[i];
    if(e.id === skipId || e.type === "line") continue;
    if(x < e.x + e.w - 0.5 && x + w > e.x + 0.5 && y < e.y + e.h - 0.5 && y + h > e.y + 0.5) return true;
  }
  return false;
}
function evadeDropY(x, y, w, h, skipId){ /* y 向下迭代落到首个无重叠空位（y 严格递增，必收敛） */
  var guard = 0;
  while(guard++ < 200){
    var maxBottom = -Infinity, list = els();
    for(var i = 0; i < list.length; i++){
      var e = list[i];
      if(e.id === skipId || e.type === "line") continue;
      if(x < e.x + e.w - 0.5 && x + w > e.x + 0.5 && y < e.y + e.h - 0.5 && y + h > e.y + 0.5)
        maxBottom = Math.max(maxBottom, e.y + e.h);
    }
    if(maxBottom === -Infinity) break;
    y = maxBottom + 3;
  }
  return y;
}
function calcEvade(x, y, w, h, skipId, moveX){ /* 重叠时的避让落位；返回 {x,y} 或 null（不重叠/off） */
  var mode = state.pgSet.layoutMode;
  if(!mode || mode === "off") return null;
  if(!overlapsAnyAt(x, y, w, h, skipId)) return null;
  var ex = x;
  if(moveX && mode === "cols2"){ /* 双列：x 吸附到较近的一列 */
    var a = innerArea(), half = (a.w - 3) / 2;
    ex = (x + w / 2 < a.w / 2) ? 0 : Math.round((half + 3) * 10) / 10;
  }
  return { x: ex, y: evadeDropY(ex, y, w, h, skipId) };
}
function autoEvade(el, moveX){ /* 落位应用：只改被操作控件坐标，其他控件不动；返回是否移动 */
  var p = calcEvade(el.x, el.y, el.w, el.h, el.id, moveX);
  if(!p) return false;
  el.x = p.x; el.y = p.y;
  return true;
}
function hideGhost(){

/* ===== v1.5.2 同行顶部吸附对齐：与已放置控件水平同行时，吸附其顶部（参考 DocuGenius 排版效果） ===== */
function rowAlignCalc(dragId){
  var mode = state.pgSet.layoutMode;
  if(!mode || mode === "off") return null;
  var drag = els().find(function(e){ return e.id === dragId; });
  if(!drag) return null;
  var minY = Infinity, x1 = drag.x, x2 = drag.x + drag.w, found = false;
  els().forEach(function(e){
    if(e.id === dragId || e.type === "line") return;
    if(e.y < drag.y + drag.h - 0.5 && e.y + e.h > drag.y + 0.5){ /* y 区间重叠 = 视觉同行 */
      found = true;
      minY = Math.min(minY, e.y);
      x1 = Math.min(x1, e.x); x2 = Math.max(x2, e.x + e.w);
    }
  });
  if(!found || Math.abs(drag.y - minY) <= 0.5) return null; /* 已对齐则不吸附 */
  return { y: minY, x1: x1, x2: x2 };
}

/* 字段类型元信息（数据源面板 + 更换字段对话框共用）：ic=类型图标 type=类型文案 */
function fieldMeta(name){
  var v = RECORDS[0] ? RECORDS[0][name] : undefined;
  var s = v === undefined || v === null ? "" : String(v);
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return { ic:"▦", type:"日期" };
  if(s !== "" && !isNaN(+s)) return { ic:"Σ", type:"数字" };
  return { ic:"A≡", type:"文本" };
}

function applyFieldChange(newField){
  closeFieldDlg();
  var el = findElById(chipCtx.elId);
  if(!el || !chipCtx.raw) return;
  var tokenOld = "{{" + chipCtx.raw + "}}";
  var tokenNew = /^SUM\(/.test(chipCtx.raw) ? "{{SUM(" + newField + ")}}" : "{{" + newField + "}}";
  var changed = false;
  eachTextValue(el, function(kind, r, c){
    var v = kind === "content" ? el.props.content : el.props.cells[r][c];
    if(v.indexOf(tokenOld) < 0) return;
    v = v.split(tokenOld).join(tokenNew);
    if(kind === "content") el.props.content = v; else el.props.cells[r][c] = v;
    changed = true;
  });
  if(changed){ commit(); renderContent(); saveState(); }
}

/* ===== v1.3 编辑自动表格列：列头文字自定义 + 关联字段选择 + 删除列 ===== */
function openAutoColDlg(elId, col){
  removeChipPop();
  var el = findElById(elId);
  if(!el || el.type !== "autotable") return;
  var fs = autoFieldsOf(el);
  var titles = el.props.titles || [];
  atCtx = {
    elId: elId, col: col,
    field: col < 0 ? null : (fs[col] || null),
    title: col < 0 ? "" : (titles[col] || "")
  };
  $("atTitleInput").value = atCtx.title;
  $("acSearch").value = "";
  $("atDelBtn").style.display = col < 0 ? "none" : "";
  renderAutoColList("");
  $("autoColModal").classList.add("show");
  $("atTitleInput").focus();
}
function closeAutoColDlg(){ $("autoColModal").classList.remove("show"); atCtx = null; }

/* 关联字段列表（搜索 + 点选高亮，点「确定」统一生效） */
function renderAutoColList(q){
  var list = $("acList");
  if(!list) return;
  q = (q || "").trim().toLowerCase();
  var html = FIELDS.filter(function(f){ return !q || f.toLowerCase().indexOf(q) >= 0; })
    .map(function(f){
      var m = fieldMeta(f);
      var act = atCtx && atCtx.field === f ? " active" : "";
      return '<div class="fm-item'+act+'" data-f="'+esc(f)+'">' +
        '<span class="fm-ic">'+m.ic+'</span><span class="fm-txt"><b>'+esc(f)+'</b><i>'+m.type+'</i></span></div>';
    }).join("");
  list.innerHTML = html || '<div class="fm-item" style="cursor:default"><span class="fm-ic">∅</span><span class="fm-txt"><b>无匹配字段</b></span></div>';
  list.querySelectorAll(".fm-item[data-f]").forEach(function(it){
    it.addEventListener("click", function(){
      if(!atCtx) return;
      atCtx.field = it.dataset.f;
      renderAutoColList($("acSearch").value);
    });
  });
}

/* 确定：写回 fields + titles（title 空则渲染时 fallback 字段名） */
function applyAutoColumn(){
  var ctx = atCtx;
  if(!ctx){ closeAutoColDlg(); return; }
  var el = findElById(ctx.elId);
  if(!el || el.type !== "autotable"){ closeAutoColDlg(); return; }
  var field = ctx.field || FIELDS[0];
  var title = (ctx.title || "").trim();
  if(!field){ closeAutoColDlg(); return; }
  var fs = el.props.fields ? el.props.fields.slice() : state.autoFields.slice();
  var titles = el.props.titles ? el.props.titles.slice() : [];
  if(ctx.col < 0){
    fs.push(field); titles.length = fs.length - 1; titles.push(title);
  } else {
    fs[ctx.col] = field;
    while(titles.length < fs.length) titles.push("");
    titles[ctx.col] = title;
  }
  el.props.fields = fs;
  el.props.titles = titles;
  closeAutoColDlg();
  commit(); renderContent(); saveState();
}

/* 删除列（fields/titles 同步删）——对话框「删除此列」与 chip 气泡「🗑」共用 */
function deleteColAt(elId, col){
  var el = findElById(elId);
  if(!el || el.type !== "autotable" || col < 0) return;
  var fs = el.props.fields ? el.props.fields.slice() : state.autoFields.slice();
  var titles = el.props.titles ? el.props.titles.slice() : [];
  fs.splice(col, 1);
  if(titles.length > col) titles.splice(col, 1);
  el.props.fields = fs;
  el.props.titles = titles;
  commit(); renderContent(); saveState();
}
function deleteAutoCol(){
  var ctx = atCtx;
  if(!ctx || ctx.col < 0) return;
  deleteColAt(ctx.elId, ctx.col);
  closeAutoColDlg();
}

/* ===== v1.4 自动表格单元格 chip 气泡（对齐官方：[字段名] + 状态警告 + 更换/删除） ===== */
var atPopEl = null, atPopCtx = null;
function removeAtPop(){ if(atPopEl){ atPopEl.remove(); atPopEl = null; } atPopCtx = null; }
function showAtPop(chip){
  removeAtPop(); removeChipPop();
  var elDiv = chip.closest(".el");
  if(!elDiv) return;
  var col = parseInt(chip.getAttribute("data-col"), 10);
  if(isNaN(col)) return;
  var el = findElById(elDiv.dataset.id);
  if(!el || el.type !== "autotable") return;
  atPopCtx = { elId: elDiv.dataset.id, col: col };
  var fs = autoFieldsOf(el);
  var fname = fs[col] || "";
  var ok = FIELDS.indexOf(fname) >= 0;
  var pop = document.createElement("div");
  pop.className = "chip-pop";
  pop.innerHTML =
    '<span class="cp-name" title="'+esc(fname)+'">['+esc(fname)+']</span>' +
    '<button class="cp-btn" data-act="change">更改</button>' +
    '<button class="cp-btn" data-act="del" title="删除此列">删除</button>' +
    (ok ? "" : '<div class="atp-warn">字段改名或被删除</div>');
  document.body.appendChild(pop);
  var r = chip.getBoundingClientRect();
  var pr = pop.getBoundingClientRect();
  var left = r.left + window.scrollX;
  var maxLeft = window.scrollX + document.documentElement.clientWidth - pr.width - 8;
  pop.style.left = Math.max(4, Math.min(left, maxLeft)) + "px";
  pop.style.top = (r.bottom + window.scrollY + 6) + "px";
  atPopEl = pop;
  pop.addEventListener("click", function(ev){
    ev.stopPropagation();
    var btn = ev.target.closest(".cp-btn");
    if(!btn || !atPopCtx) return;
    var c = atPopCtx;
    if(btn.dataset.act === "change"){ removeAtPop(); openAutoColDlg(c.elId, c.col); }
    else if(btn.dataset.act === "del"){ removeAtPop(); deleteColAt(c.elId, c.col); }
  });
}

function deleteChip(){
  var el = findElById(chipCtx.elId);
  removeChipPop();
  if(!el || !chipCtx.raw) return;
  var token = "{{" + chipCtx.raw + "}}";
  eachTextValue(el, function(kind, r, c){
    var v = kind === "content" ? el.props.content : el.props.cells[r][c];
    if(v.indexOf(token) < 0) return;
    v = v.split(token).join("");
    if(kind === "content") el.props.content = v; else el.props.cells[r][c] = v;
  });
  commit(); renderContent(); saveState();
}

/* =====================================================================
 * v1.1 输入【快速插入字段（对齐官方：编辑文本/单元格时敲 [ 或 【，
 *      光标处弹出字段选择浮层，选中后【+过滤词整体替换为字段 chip）
 * ===================================================================== */
var fpCtx = null;  /* {host, el, kind, r, c, filter, active} */
var fpBox = null;  /* 浮层 DOM */

function fpClose(){ if(fpBox){ fpBox.remove(); fpBox = null; } fpCtx = null; }

/* 光标前未闭合的【触发符 → 返回过滤词（无触发返回 null） */
function fpMatchBefore(host){
  var sel = window.getSelection();
  if(!sel.rangeCount || !sel.isCollapsed || !host.contains(sel.getRangeAt(0).startContainer)) return null;
  var r = sel.getRangeAt(0);
  var pre = r.cloneRange();
  pre.selectNodeContents(host);
  pre.setEnd(r.startContainer, r.startOffset);
  var m = pre.toString().match(/[\[【]([^\]】]*)$/);
  return m ? m[1] : null;
}

/* 纯文本偏移 → DOM 位置（host 内第 target 个字符所在的节点/偏移） */
function fpTextPos(host, target){
  var w = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, null);
  var n, acc = 0;
  while((n = w.nextNode())){
    if(acc + n.nodeValue.length >= target) return { node:n, offset:target-acc };
    acc += n.nodeValue.length;
  }
  return null;
}

/* input 时检测：host=编辑容器 el=元素 kind=content|cell r/c=单元格行列 */
function fpCheck(host, el, kind, r, c){
  var f = fpMatchBefore(host);
  if(f === null || f.indexOf("]") >= 0 || f.indexOf("】") >= 0){ fpClose(); return; }
  if(!fpCtx || fpCtx.host !== host){
    fpCtx = { host:host, el:el, kind:kind, r:r, c:c, filter:f, active:0 };
  } else {
    fpCtx.el = el; fpCtx.kind = kind; fpCtx.r = r; fpCtx.c = c;
    if(fpCtx.filter !== f){ fpCtx.filter = f; fpCtx.active = 0; }
  }
  fpShow();
}

function fpShow(){
  if(!fpCtx) return;
  var list = FIELDS.filter(function(f){ return !fpCtx.filter || f.toLowerCase().indexOf(fpCtx.filter.toLowerCase()) >= 0; });
  if(fpCtx.active >= list.length) fpCtx.active = 0;
  if(!fpBox){
    fpBox = document.createElement("div");
    fpBox.className = "field-picker";
    fpBox.addEventListener("mousedown", function(ev){ ev.preventDefault(); }); /* 防抢焦点导致编辑器 blur */
    fpBox.addEventListener("click", function(ev){
      ev.stopPropagation();
      var it = ev.target.closest(".fp-item");
      if(it && it.dataset.f) fpPick(it.dataset.f);
    });
    document.body.appendChild(fpBox);
  }
  var sel = window.getSelection();
  var rect = sel.rangeCount ? sel.getRangeAt(0).getBoundingClientRect() : null;
  if(!rect || (!rect.width && !rect.height)) rect = fpCtx.host.getBoundingClientRect();
  var maxLeft = window.scrollX + document.documentElement.clientWidth - 246;
  fpBox.style.left = Math.max(4, Math.min(rect.left + window.scrollX, maxLeft)) + "px";
  fpBox.style.top = (rect.bottom + window.scrollY + 6) + "px";
  fpBox.innerHTML = '<div class="fp-head">选择字段' + (fpCtx.filter ? ' · "' + esc(fpCtx.filter) + '"' : '') + '</div>' +
    (list.length ? list.map(function(f, i){
      var m = fieldMeta(f);
      return '<div class="fp-item'+(i===fpCtx.active?' active':'')+'" data-f="'+esc(f)+'">' +
        '<span class="fp-ic">'+m.ic+'</span><b>'+esc(f)+'</b><i>'+m.type+'</i></div>';
    }).join("") : '<div class="fp-item" style="cursor:default;color:#86909c"><span class="fp-ic">∅</span><b>无匹配字段，Esc 关闭</b></div>');
}

/* 选中字段：从触发符到光标整体删除，原位插入 chip，光标落在 chip 后 */
function fpPick(name){
  if(!fpCtx) return;
  var host = fpCtx.host, el = fpCtx.el, kind = fpCtx.kind, r = fpCtx.r, c = fpCtx.c;
  var sel = window.getSelection();
  if(!sel.rangeCount){ fpClose(); return; }
  var cr = sel.getRangeAt(0);
  if(!host.contains(cr.startContainer)){ fpClose(); return; }
  var pre = cr.cloneRange();
  pre.selectNodeContents(host);
  pre.setEnd(cr.startContainer, cr.startOffset);
  var txt = pre.toString();
  var idx = Math.max(txt.lastIndexOf("["), txt.lastIndexOf("【"));
  if(idx < 0){ fpClose(); return; }
  var start = fpTextPos(host, idx);
  fpClose();
  if(!start) return;
  var del = document.createRange();
  del.setStart(start.node, start.offset);
  del.setEnd(cr.startContainer, cr.startOffset);
  del.deleteContents();
  var chip = document.createElement("span");
  chip.className = "fld-chip chip-ok";
  chip.setAttribute("data-raw", name);
  chip.setAttribute("contenteditable", "false");
  chip.innerHTML = esc(chipLabel(name)) + ' <i class="chip-caret">⌄</i>';
  del.insertNode(chip);
  var anchor = document.createTextNode("");
  if(chip.after) chip.after(anchor); else chip.parentNode.insertBefore(anchor, chip.nextSibling);
  host.focus();
  var r2 = document.createRange();
  r2.setStart(anchor, 0); r2.collapse(true);
  sel.removeAllRanges(); sel.addRange(r2);
  /* 立即落库（commit 不重渲染，光标保留；blur 时不重复保存） */
  var raw = richToRaw(host);
  if(kind === "content"){
    if(raw !== el.props.content){ el.props.content = raw; }
  } else {
    el.props.cells = el.props.cells || {};
    el.props.cells[r] = el.props.cells[r] || {};
    el.props.cells[r][c] = raw;
  }
  commit(); saveState();
}

/* 浮层打开时的键盘导航：↑↓ 选择 / Enter·Tab 确认 / Esc 关闭 */
function fpKeydown(ev){
  if(!fpBox || !fpCtx) return;
  if(ev.key === "ArrowDown" || ev.key === "ArrowUp"){
    ev.preventDefault();
    var items = fpBox.querySelectorAll(".fp-item[data-f]");
    if(!items.length) return;
    fpCtx.active = (fpCtx.active + (ev.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
    items.forEach(function(n, i){ n.classList.toggle("active", i === fpCtx.active); });
    var cur = items[fpCtx.active];
    if(cur && cur.scrollIntoView) cur.scrollIntoView({ block:"nearest" });
  } else if(ev.key === "Enter" || ev.key === "Tab"){
    var it = fpBox.querySelector(".fp-item.active[data-f]") || fpBox.querySelector(".fp-item[data-f]");
    if(it){ ev.preventDefault(); fpPick(it.dataset.f); }
  } else if(ev.key === "Escape"){
    ev.preventDefault();
    fpClose();
  }
}

/* =====================================================================
 * 打印 & 总渲染
 * ===================================================================== */
function doPrint(){
  var area = $("printArea");
  buildPages(area);
  window.print();
}
function renderAll(){
  renderSide();
  renderTopbar();
  renderContent();
}

loadState();
renderAll();
</script>
