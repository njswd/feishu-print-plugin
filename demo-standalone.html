<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>打印排版插件 Demo · 对标官方「排版打印」</title>
<style>
  :root{
    --ink:#1f2329; --sub:#646a73; --line:#e5e6eb; --blue:#3370ff;
    --blue-bg:#f0f4ff; --card:#f7f8fa; --danger:#d83931;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:var(--ink); font-size:14px; background:#eef0f3; overflow:hidden;}

  /* ===== 顶部工具栏 ===== */
  header{height:48px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 14px;}
  header h1{font-size:15px; margin-right:4px;}
  header select, header input{padding:4px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px;}
  .icon-btn{border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 9px; font-size:12.5px; cursor:pointer;}
  .icon-btn:hover{border-color:var(--blue); color:var(--blue);}
  .save-hint{font-size:12px; color:var(--sub); margin-left:auto;}
  .btn-print{background:var(--blue); color:#fff; border:none; padding:7px 16px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;}
  .btn-print:hover{background:#2860e1;}

  .layout{display:flex; height:calc(100% - 48px);}
  .sidebar{width:272px; flex-shrink:0; background:#fff; border-right:1px solid var(--line); overflow-y:auto; padding:12px;}
  .stage{flex:1; overflow:auto; padding:24px; background:#e2e5ea;}

  /* ===== 左侧 ===== */
  .sec-title{font-size:12px; color:var(--sub); margin:14px 0 6px; font-weight:600;}
  .sec-title:first-child{margin-top:0;}
  .palette{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .pal-item{border:1px solid var(--line); border-radius:8px; padding:9px 6px; text-align:center; font-size:13px; cursor:grab; background:#fff; user-select:none;}
  .pal-item:hover{border-color:var(--blue); color:var(--blue); background:var(--blue-bg);}
  .tpl-list{display:flex; flex-direction:column; gap:6px;}
  .tpl-item{display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; cursor:pointer;}
  .tpl-item:hover{border-color:var(--blue);}
  .tpl-item.on{border-color:var(--blue); background:var(--blue-bg);}
  .tpl-item .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tpl-item .op{font-size:11px; color:var(--sub); background:none; border:none; cursor:pointer; padding:2px;}
  .tpl-item .op:hover{color:var(--blue);}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-size:11.5px; background:var(--blue-bg); color:var(--blue); border:none; padding:3px 9px; border-radius:99px; cursor:pointer;}
  .chip:hover{background:#dbe6ff;}
  .prop-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .prop-grid label{font-size:11px; color:var(--sub); display:block;}
  .prop-grid input,.prop-grid select{width:100%; padding:4px 6px; border:1px solid var(--line); border-radius:5px; font-size:12px;}
  .props textarea{width:100%; height:64px; padding:6px; border:1px solid var(--line); border-radius:5px; font-size:12px; font-family:inherit; resize:vertical;}
  .btn-sm{border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px; font-size:12px; cursor:pointer; width:100%; margin-top:6px;}
  .btn-sm:hover{border-color:var(--blue); color:var(--blue);}
  .btn-del{width:100%; margin-top:8px; background:#fff1f0; color:var(--danger); border:1px solid #ffccc7; padding:6px; border-radius:6px; cursor:pointer; font-size:12.5px;}
  .btn-del:hover{background:#ffccc7;}
  .empty-tip{font-size:12px; color:var(--sub); padding:8px; background:var(--card); border-radius:6px; line-height:1.6;}
  .fld-check{display:flex; align-items:center; gap:5px; font-size:12px; padding:2px 0;}

  /* ===== 纸张与元素 ===== */
  .paper{background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.15); position:relative; margin:0 auto 24px; overflow:hidden;}
  .paper-label{position:absolute; top:5px; right:10px; font-size:11px; color:#c0c4cc; z-index:1;}
  .el{position:absolute; cursor:move; user-select:none;}
  .el.selected{outline:2px solid var(--blue); outline-offset:1px;}
  .el .content{width:100%; height:100%; overflow:hidden; pointer-events:none;}
  .el .content.editable{pointer-events:auto;}
  .el .content[contenteditable]:focus{outline:1px dashed var(--blue);}
  .resize-handle{position:absolute; right:-5px; bottom:-5px; width:10px; height:10px; background:var(--blue); border:2px solid #fff; border-radius:50%; cursor:nwse-resize; display:none; z-index:5;}
  .el.selected .resize-handle{display:block;}
  .el-text .content{line-height:1.6; word-break:break-all; white-space:pre-wrap;}
  .el-line{border-top:1.5px solid #333;}
  .el-table table{width:100%; height:100%; border-collapse:collapse;}
  .el-table td,.el-table th{border:1px solid #444; padding:2px 4px; font-size:12px;}
  .el-autotable table{width:100%; border-collapse:collapse;}
  .el-autotable td,.el-autotable th{border:1px solid #444; padding:3px 5px; font-size:12px; text-align:left;}
  .el-autotable th{background:#f2f2f2;}
  .el-img img{width:100%; height:100%; object-fit:contain;}
  .el-qr,.el-bar{background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .qr-box img{width:100%; height:100%;}
  .lib-fallback{font-size:10.5px; color:#999; text-align:center; padding:4px;}
  .el-sign .content{display:flex; align-items:center; justify-content:center;}
  .sign-zone{width:100%; height:100%; border:1.5px dashed #999; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#999; font-size:11px;}
  .sign-zone img{width:100%; height:100%; object-fit:contain;}

  /* ===== 签名弹窗 ===== */
  .modal-mask{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:99;}
  .modal-mask.show{display:flex;}
  .modal{background:#fff; border-radius:12px; padding:20px; width:660px; max-width:92vw;}
  .modal h3{font-size:15px; margin-bottom:10px;}
  #signCanvas{border:1.5px dashed var(--blue); border-radius:8px; background:#fff; cursor:crosshair; width:100%; touch-action:none;}
  .modal .row{display:flex; gap:10px; margin-top:12px; justify-content:flex-end;}
  .modal button{border:none; border-radius:8px; padding:8px 20px; font-size:13px; cursor:pointer;}
  .modal .clear{background:var(--card); color:var(--ink);}
  .modal .ok{background:var(--blue); color:#fff; font-weight:600;}

  /* ===== 打印 ===== */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important; position:absolute; left:0; top:0; width:100%;}
    body{overflow:visible; background:#fff;}
    .paper{box-shadow:none; margin:0; page-break-after:always;}
    .paper:last-child{page-break-after:auto;}
    .paper-label{display:none;}
    .el{outline:none !important;}
    .el .content[contenteditable]{outline:none;}
    .resize-handle{display:none !important;}
    @page{margin:0;}
  }
</style>
</head>
<body>

<header>
  <h1>🖨️ 排版打印</h1>
  <select id="tplSelect" style="max-width:150px" title="当前模板"></select>
  <button class="icon-btn" onclick="newBlankTpl()">＋新建</button>
  <button class="icon-btn" onclick="renameTpl()">✏️ 重命名</button>
  <button class="icon-btn" onclick="delTpl()">🗑 删除</button>
  <span style="border-left:1px solid var(--line); height:22px;"></span>
  <select id="paperSize" title="纸张">
    <option value="A4">A4</option><option value="A5">A5</option><option value="letter">Letter</option>
  </select>
  <select id="orient" title="方向">
    <option value="portrait">竖版</option><option value="landscape">横版</option>
  </select>
  <input id="margin" type="number" value="15" min="5" max="40" style="width:60px" title="页边距 mm">
  <label style="font-size:12px;color:var(--sub)">每页行数</label>
  <input id="perPage" type="number" value="8" min="1" max="30" style="width:54px" title="自动表格每页行数">
  <span class="save-hint">*改动将自动保存</span>
  <button class="btn-print" onclick="doPrint()">🖨️ 打印 / 存 PDF</button>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sec-title">模板库 · 点击套用（当前模板内容将被替换）</div>
    <div class="palette" id="presetBox"></div>

    <div class="sec-title">元素库 · 拖到右侧纸张上</div>
    <div class="palette">
      <div class="pal-item" draggable="true" data-type="text">📝 文本</div>
      <div class="pal-item" draggable="true" data-type="line">━ 水平线</div>
      <div class="pal-item" draggable="true" data-type="table">▦ 表格</div>
      <div class="pal-item" draggable="true" data-type="autotable">🔁 自动表格</div>
      <div class="pal-item" draggable="true" data-type="image">🖼️ 图片</div>
      <div class="pal-item" draggable="true" data-type="qrcode">⊟ 二维码</div>
      <div class="pal-item" draggable="true" data-type="barcode">🕋 条形码</div>
      <div class="pal-item" draggable="true" data-type="sign">✍️ 签名</div>
    </div>

    <div class="sec-title">记录字段（插入到选中文本）</div>
    <div class="chips" id="fieldChips"></div>

    <div class="sec-title">元素属性</div>
    <div id="propsBox"></div>

    <div class="sec-title">自动表格 · 显示字段</div>
    <div id="autoTableFields"></div>
  </div>

  <div class="stage" id="stage">
    <div class="paper" id="editorPaper"></div>
  </div>
</div>

<!-- 签名弹窗 -->
<div class="modal-mask" id="signModal">
  <div class="modal">
    <h3>✍️ 手写签名（鼠标按住拖动书写）</h3>
    <canvas id="signCanvas" width="600" height="220"></canvas>
    <div class="row">
      <button class="clear" onclick="clearSign()">清 空</button>
      <button class="clear" onclick="closeSign()">取 消</button>
      <button class="ok" onclick="saveSign()">确 认</button>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
/* =====================================================================
 * 模拟数据（真实插件中来自飞书 SDK）
 * ===================================================================== */
var FIELDS = ["客户名称","产品名称","箱型规格","数量","单位","单价","金额","备注","出货日期"];
var RECORDS = [
  {"客户名称":"富士侨（南京）","产品名称":"免熏蒸木箱","箱型规格":"1200×1000×900","数量":"40","单位":"只","单价":"320","金额":"12800","备注":"液冷服务器机柜，四面防撞条","出货日期":"2026-09-28"},
  {"客户名称":"广达上海","产品名称":"胶合板托盘","箱型规格":"1200×1000×150","数量":"120","单位":"个","单价":"85","金额":"10200","备注":"IPPC 标识已加印","出货日期":"2026-09-29"},
  {"客户名称":"纬创昆山","产品名称":"钢边木箱","箱型规格":"1100×800×600","数量":"18","单位":"只","单价":"260","金额":"4680","备注":"内衬防潮膜","出货日期":"2026-09-30"},
  {"客户名称":"派能科技","产品名称":"免熏蒸木箱","箱型规格":"900×600×500","数量":"65","单位":"只","单价":"180","金额":"11700","备注":"储能电池模组，防漏托盘","出货日期":"2026-10-02"},
  {"客户名称":"南京苏威达","产品名称":"周转木架","箱型规格":"定制","数量":"30","单位":"套","单价":"95","金额":"2850","备注":"发惠州中转仓","出货日期":"2026-10-08"},
  {"客户名称":"富士侨（南京）","产品名称":"钢边木箱","箱型规格":"1000×900×700","数量":"22","单位":"只","单价":"240","金额":"5280","备注":"加急","出货日期":"2026-10-09"}
];
var SIZES = { A4:[210,297], A5:[148,210], letter:[216,279] };
var MM = 3.78;

/* =====================================================================
 * 内置模板库（对标官方推荐模板）
 * ===================================================================== */
function presetChuku(){ // 产品出库单
  return [
    { id:"p1", type:"text", x:70, y:12, w:70, h:12, props:{ content:"产 品 出 库 单", fontSize:22, bold:true, align:"center" } },
    { id:"p2", type:"text", x:15, y:30, w:120, h:10, props:{ content:"单号：{{客户名称}}-{{出货日期}}", fontSize:12, align:"left" } },
    { id:"p3", type:"autotable", x:15, y:45, w:180, h:60, props:{} },
    { id:"p4", type:"text", x:15, y:112, w:100, h:10, props:{ content:"经手人：________　审核：________", fontSize:12, align:"left" } },
    { id:"p5", type:"qrcode", x:170, y:105, w:25, h:25, props:{ content:"https://njswd.github.io/feishu-print-plugin/" } }
  ];
}
function presetBaojia(){ // 销售报价单
  return [
    { id:"p1", type:"text", x:70, y:10, w:70, h:12, props:{ content:"销 售 报 价 单", fontSize:22, bold:true, align:"center" } },
    { id:"p2", type:"text", x:15, y:28, w:90, h:9, props:{ content:"客户名称：{{客户名称}}", fontSize:12, align:"left" } },
    { id:"p3", type:"text", x:130, y:28, w:65, h:9, props:{ content:"报价日期：{{出货日期}}", fontSize:12, align:"left" } },
    { id:"p4", type:"autotable", x:15, y:42, w:180, h:55, props:{} },
    { id:"p5", type:"line", x:15, y:104, w:180, h:2, props:{} },
    { id:"p6", type:"text", x:15, y:110, w:110, h:18, props:{ content:"报价说明：\n1. 以上价格含税含运费；\n2. 有效期 30 天。", fontSize:11, align:"left" } },
    { id:"p7", type:"sign", x:135, y:108, w:60, h:22, props:{} },
    { id:"p8", type:"text", x:135, y:131, w:60, h:8, props:{ content:"（供方签章）", fontSize:10, align:"center" } }
  ];
}
function presetXunjian(){ // 巡检记录
  return [
    { id:"p1", type:"text", x:65, y:10, w:80, h:12, props:{ content:"巡 检 记 录 表", fontSize:22, bold:true, align:"center" } },
    { id:"p2", type:"text", x:15, y:28, w:90, h:9, props:{ content:"巡检日期：{{出货日期}}", fontSize:12, align:"left" } },
    { id:"p3", type:"text", x:110, y:28, w:85, h:9, props:{ content:"巡检人：____________", fontSize:12, align:"left" } },
    { id:"p4", type:"autotable", x:15, y:42, w:180, h:70, props:{} },
    { id:"p5", type:"text", x:15, y:118, w:180, h:16, props:{ content:"异常情况记录：\n", fontSize:11, align:"left" } },
    { id:"p6", type:"line", x:15, y:140, w:180, h:2, props:{} },
    { id:"p7", type:"sign", x:140, y:145, w:55, h:20, props:{} },
    { id:"p8", type:"text", x:140, y:166, w:55, h:8, props:{ content:"（负责人签字）", fontSize:10, align:"center" } }
  ];
}
var PRESETS = [
  { name:"📋 产品出库单", make:presetChuku },
  { name:"💰 销售报价单", make:presetBaojia },
  { name:"✅ 巡检记录表", make:presetXunjian }
];

/* =====================================================================
 * 状态（多模板管理）
 * ===================================================================== */
var state = {
  mode: "edit",
  autoFields: ["客户名称","产品名称","箱型规格","数量","单位","单价","金额","出货日期"],
  templates: [
    { id:"t1", name:"产品出库单", elements: presetChuku() }
  ],
  currentTpl: "t1",
  selectedId: null
};
var nextId = 100;

function $(id){ return document.getElementById(id); }
function uid(){ return "e" + (nextId++); }
function curTpl(){ return state.templates.find(function(t){ return t.id === state.currentTpl; }); }
function els(){ var t = curTpl(); return t ? t.elements : []; }
function selected(){ return els().find(function(e){ return e.id === state.selectedId; }) || null; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function nextElId(){
  var max = 0;
  state.templates.forEach(function(t){ t.elements.forEach(function(e){ var n = parseInt(e.id.slice(1)); if(n > max) max = n; }); });
  return "e" + (max + 1);
}

/* =====================================================================
 * 自动保存 / 加载
 * ===================================================================== */
var SAVE_KEY = "print-plugin-layout-v3";
function saveState(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      templates: state.templates, currentTpl: state.currentTpl, autoFields: state.autoFields,
      paper: $("paperSize").value, landscape: $("orient").value === "landscape",
      margin: $("margin").value, perPage: $("perPage").value
    }));
  }catch(e){}
}
function loadState(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d.templates && d.templates.length){
      state.templates = d.templates;
      state.currentTpl = d.currentTpl || d.templates[0].id;
      state.templates.forEach(function(t){ t.elements.forEach(function(e){ var n = parseInt(e.id.slice(1)); if(n >= nextId) nextId = n + 1; }); });
    }
    if(d.autoFields) state.autoFields = d.autoFields;
    if(d.paper) $("paperSize").value = d.paper;
    if(d.landscape) $("orient").value = "landscape";
    if(d.margin) $("margin").value = d.margin;
    if(d.perPage) $("perPage").value = d.perPage;
  }catch(e){}
}

/* =====================================================================
 * 变量替换 & 内容渲染
 * ===================================================================== */
function renderTpl(tpl, data){
  return String(tpl).replace(/\{\{(.*?)\}\}/g, function(_, name){
    var v = data[name.trim()];
    return (v === undefined || v === null) ? "" : String(v);
  });
}

function renderElContent(el, data){
  var p = el.props || {};
  var style = "font-size:" + (p.fontSize || 14) + "px;" +
              (p.bold ? "font-weight:700;" : "") +
              "text-align:" + (p.align || "left") + ";";
  switch(el.type){
    case "text":
      return '<div class="content editable" style="' + style + '" contenteditable="true">' +
             esc(renderTpl(p.content || "双击编辑文本", data || {})) + "</div>";
    case "line":
      return '<div class="content el-line"></div>';
    case "image":
      return '<div class="content el-img"><img src="' + esc(p.src || "") + '" alt=""></div>';
    case "qrcode":
      return '<div class="content el-qr" data-qr="' + esc(p.content || "") + '"></div>';
    case "barcode":
      return '<div class="content el-bar" data-bar="' + esc(p.content || "") + '"></div>';
    case "sign":
      if(p.src) return '<div class="content el-sign"><div class="sign-zone"><img src="' + p.src + '"></div></div>';
      return '<div class="content el-sign"><div class="sign-zone">签名区<br>(属性面板点「手写签名」)</div></div>';
    case "table":
      var rows = p.rows || 3, cols = p.cols || 3;
      var html = "<table>";
      for(var r = 0; r < rows; r++){
        html += "<tr>";
        for(var c = 0; c < cols; c++)
          html += '<td style="text-align:' + (p.align || "left") + '">' + ((p.cells && p.cells[r] && p.cells[r][c]) || "") + "</td>";
        html += "</tr>";
      }
      return '<div class="content el-table" style="' + style + '">' + html + "</div>";
    case "autotable":
      var fs = state.autoFields;
      var head = "<tr>" + fs.map(function(f){ return "<th>" + esc(f) + "</th>"; }).join("") + "</tr>";
      var sample = RECORDS.slice(0, 2).map(function(rec){
        return "<tr>" + fs.map(function(f){ return "<td>" + esc(rec[f] || "") + "</td>"; }).join("") + "</tr>";
      }).join("");
      return '<div class="content el-autotable"><table>' + head + sample +
             '<tr><td colspan="' + fs.length + '" style="color:#bbb;text-align:center">…预览时自动填入全部记录并分页…</td></tr></table></div>';
  }
  return "";
}

function paintCodes(rootEl){
  if(!window.QRCode || !window.JsBarcode){
    rootEl.querySelectorAll(".el-qr,.el-bar").forEach(function(box){
      if(!box.querySelector(".lib-fallback"))
        box.innerHTML = '<div class="lib-fallback">' + (box.classList.contains("el-qr") ? "二维码" : "条形码") + '<br>(需联网加载库)</div>';
    });
    return;
  }
  rootEl.querySelectorAll(".el-qr").forEach(function(box){
    var txt = box.getAttribute("data-qr") || " ";
    box.innerHTML = "";
    try{ new QRCode(box, { text: txt, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); }catch(e){}
  });
  rootEl.querySelectorAll(".el-bar").forEach(function(box){
    var txt = box.getAttribute("data-bar") || "0000000000";
    box.innerHTML = '<svg class="bar-svg"></svg>';
    try{
      JsBarcode(box.querySelector(".bar-svg"), txt, { format:"CODE128", displayValue:true, height:60, fontSize:12, margin:0 });
    }catch(e){}
  });
}

/* =====================================================================
 * 编辑器渲染
 * ===================================================================== */
function paperSizeMM(){
  var s = SIZES[$("paperSize").value];
  return $("orient").value === "landscape" ? { w: s[1], h: s[0] } : { w: s[0], h: s[1] };
}

function renderEditor(){
  var dim = paperSizeMM();
  var paper = $("editorPaper");
  paper.style.width = dim.w + "mm";
  paper.style.height = dim.h + "mm";
  paper.style.padding = $("margin").value + "mm";
  paper.querySelectorAll(".el").forEach(function(n){ n.remove(); });

  els().forEach(function(el){
    var div = document.createElement("div");
    div.className = "el el-" + el.type + (el.id === state.selectedId ? " selected" : "");
    div.style.left = el.x + "mm"; div.style.top = el.y + "mm";
    div.style.width = el.w + "mm"; div.style.height = el.h + "mm";
    div.dataset.id = el.id;
    div.innerHTML = renderElContent(el, null) + '<div class="resize-handle"></div>';
    paper.appendChild(div);

    var ce = div.querySelector("[contenteditable]");
    if(ce){
      ce.addEventListener("dblclick", function(ev){ ev.stopPropagation(); ce.focus(); });
      ce.addEventListener("blur", function(){ el.props.content = ce.textContent; saveState(); });
      ce.addEventListener("mousedown", function(ev){ ev.stopPropagation(); });
    }
    div.querySelectorAll(".el-table td").forEach(function(td, idx){
      td.contentEditable = "true";
      td.addEventListener("mousedown", function(ev){ ev.stopPropagation(); });
      td.addEventListener("blur", function(){
        var rows = el.props.rows || 3, cols = el.props.cols || 3;
        var r = Math.floor(idx / cols), c = idx % cols;
        el.props.cells = el.props.cells || {};
        el.props.cells[r] = el.props.cells[r] || {};
        el.props.cells[r][c] = td.textContent;
        saveState();
      });
    });
    bindElDrag(div, el);
    paintCodes(div);
  });
}

/* =====================================================================
 * 拖拽
 * ===================================================================== */
function bindElDrag(div, el){
  div.addEventListener("mousedown", function(ev){
    if(ev.target.classList.contains("resize-handle")) return;
    selectEl(el.id);
    ev.stopPropagation();
    var startX = ev.clientX, startY = ev.clientY, ox = el.x, oy = el.y;
    function onMove(e){
      el.x = ox + (e.clientX - startX) / MM;
      el.y = oy + (e.clientY - startY) / MM;
      div.style.left = el.x + "mm"; div.style.top = el.y + "mm";
    }
    function onUp(){
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      saveState();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  var handle = div.querySelector(".resize-handle");
  handle.addEventListener("mousedown", function(ev){
    ev.stopPropagation(); ev.preventDefault();
    var startX = ev.clientX, startY = ev.clientY, ow = el.w, oh = el.h;
    function onMove(e){
      el.w = Math.max(5, ow + (e.clientX - startX) / MM);
      el.h = Math.max(3, oh + (e.clientY - startY) / MM);
      div.style.width = el.w + "mm"; div.style.height = el.h + "mm";
    }
    function onUp(){
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      saveState();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

var dragType = null;
document.querySelectorAll(".pal-item").forEach(function(item){
  item.addEventListener("dragstart", function(e){
    dragType = item.dataset.type;
    e.dataTransfer.setData("text/plain", dragType);
  });
});

var editorPaper = $("editorPaper");
editorPaper.addEventListener("dragover", function(e){ e.preventDefault(); editorPaper.style.outline = "2px dashed var(--blue)"; editorPaper.style.outlineOffset = "-8px"; });
editorPaper.addEventListener("dragleave", function(){ editorPaper.style.outline = "none"; });
editorPaper.addEventListener("drop", function(e){
  e.preventDefault(); editorPaper.style.outline = "none";
  if(!dragType) return;
  var rect = editorPaper.getBoundingClientRect();
  var cs = getComputedStyle(editorPaper);
  var pad = parseFloat(cs.paddingLeft) / MM;
  var innerW = (rect.width - parseFloat(cs.paddingLeft) * 2) / MM;
  var innerH = (rect.height - parseFloat(cs.paddingTop) * 2) / MM;
  var x = (e.clientX - rect.left) / MM - pad;
  var y = (e.clientY - rect.top) / MM - pad;

  var defaults = {
    text:      { w: 60, h: 10,  props: { content: "双击编辑文本", fontSize: 14, bold: false, align: "left" } },
    line:      { w: 80, h: 2,   props: {} },
    table:     { w: 80, h: 30,  props: { rows: 3, cols: 3, cells: {} } },
    autotable: { w: 180, h: 60, props: {} },
    image:     { w: 40, h: 30,  props: { src: "https://dummyimage.com/300x200/e5e6eb/646a73.png&text=Image" } },
    qrcode:    { w: 25, h: 25,  props: { content: "https://example.com" } },
    barcode:   { w: 45, h: 14,  props: { content: "20260926001" } },
    sign:      { w: 60, h: 22,  props: {} }
  };
  var d = defaults[dragType];
  var el = {
    id: nextElId(), type: dragType,
    x: Math.max(0, Math.min(x, innerW - d.w)),
    y: Math.max(0, Math.min(y, innerH - d.h)),
    w: d.w, h: d.h, props: d.props
  };
  els().push(el);
  selectEl(el.id);
  renderEditor(); renderTplSelect();
  saveState();
  dragType = null;
});

editorPaper.addEventListener("mousedown", function(e){
  if(e.target === editorPaper){
    state.selectedId = null; renderEditor(); renderProps();
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Delete" && state.selectedId){
    var tag = document.activeElement && document.activeElement.tagName;
    if(tag === "INPUT" || tag === "TEXTAREA" || document.activeElement.isContentEditable) return;
    var t = curTpl();
    t.elements = t.elements.filter(function(el){ return el.id !== state.selectedId; });
    state.selectedId = null;
    renderEditor(); renderProps(); saveState();
  }
});

/* =====================================================================
 * 模板管理
 * ===================================================================== */
function renderTplSelect(){
  var sel = $("tplSelect");
  sel.innerHTML = "";
  state.templates.forEach(function(t){
    var op = document.createElement("option");
    op.value = t.id; op.textContent = t.name;
    if(t.id === state.currentTpl) op.selected = true;
    sel.appendChild(op);
  });
}
$("tplSelect").addEventListener("change", function(){
  state.currentTpl = this.value;
  state.selectedId = null;
  renderEditor(); renderProps(); saveState();
});
function newBlankTpl(){
  var name = prompt("新模板名称：", "排版 " + (state.templates.length + 1));
  if(!name) return;
  var t = { id: "t" + Date.now(), name: name, elements: [
    { id: nextElId(), type: "text", x: 70, y: 15, w: 70, h: 12, props: { content: name, fontSize: 22, bold: true, align: "center" } }
  ]};
  state.templates.push(t);
  state.currentTpl = t.id;
  state.selectedId = null;
  renderTplSelect(); renderEditor(); renderProps(); saveState();
}
function renameTpl(){
  var t = curTpl();
  var name = prompt("重命名模板：", t.name);
  if(!name) return;
  t.name = name;
  renderTplSelect(); saveState();
}
function delTpl(){
  if(state.templates.length <= 1){ alert("至少保留一个模板。"); return; }
  var t = curTpl();
  if(!confirm("确定删除模板「" + t.name + "」？")) return;
  state.templates = state.templates.filter(function(x){ return x.id !== t.id; });
  state.currentTpl = state.templates[0].id;
  state.selectedId = null;
  renderTplSelect(); renderEditor(); renderProps(); saveState();
}

/* 内置模板库按钮 */
(function(){
  var box = $("presetBox");
  PRESETS.forEach(function(p){
    var b = document.createElement("button");
    b.className = "icon-btn"; b.style.textAlign = "left";
    b.textContent = p.name;
    b.onclick = function(){

      curTpl().elements = p.make();

      renderEditor(); renderProps(); saveState();

/* =====================================================================
 * 签名（手写板弹窗）
 * ===================================================================== */
var signingEl = null, drawing = false;
function openSign(){
  var el = selected();
  if(!el || el.type !== "sign"){ alert("请先选中一个「签名」元素。"); return; }
  signingEl = el;
  $("signModal").classList.add("show");
  clearSign();
}
function closeSign(){ $("signModal").classList.remove("show"); signingEl = null; }
function clearSign(){
  var c = $("signCanvas");
  var ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
}
function saveSign(){
  if(!signingEl) return closeSign();
  signingEl.props.src = $("signCanvas").toDataURL("image/png");
  closeSign();
  renderEditor(); renderProps(); saveState();
}
(function(){
  var c = $("signCanvas"), ctx = c.getContext("2d");
  ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#1f2329";
  function pos(e){
    var r = c.getBoundingClientRect();
    return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height };
  }
  c.addEventListener("pointerdown", function(e){
    drawing = true; c.setPointerCapture(e.pointerId);
    var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
  });
  c.addEventListener("pointermove", function(e){
    if(!drawing) return;
    var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
  });
  c.addEventListener("pointerup", function(){ drawing = false; });
})();

/* =====================================================================
 * 属性面板
 * ===================================================================== */
function selectEl(id){ state.selectedId = id; renderEditor(); renderProps(); }

function renderProps(){
  var box = $("propsBox");
  var el = selected();
  if(!el){
    box.innerHTML = '<div class="empty-tip">点击纸张上的元素进行设置；双击文本可直接编辑；选中后按 Delete 删除。</div>';
    return;
  }
  var p = el.props || {};
  var html = '<div class="prop-grid">' +
    '<div><label>X (mm)</label><input id="px" type="number" value="' + el.x.toFixed(1) + '"></div>' +
    '<div><label>Y (mm)</label><input id="py" type="number" value="' + el.y.toFixed(1) + '"></div>' +
    '<div><label>宽 (mm)</label><input id="pw" type="number" value="' + el.w.toFixed(1) + '"></div>' +
    '<div><label>高 (mm)</label><input id="ph" type="number" value="' + el.h.toFixed(1) + '"></div>' +
    "</div>";
  if(el.type === "text"){
    html += '<div style="margin-top:6px"><label style="font-size:11px;color:var(--sub)">文本内容</label>' +
      '<div class="props"><textarea id="pc">' + esc(p.content || "") + "</textarea></div>" +
      '<div class="prop-grid" style="margin-top:6px">' +
      '<div><label>字号(px)</label><input id="pfs" type="number" value="' + (p.fontSize || 14) + '"></div>' +
      '<div><label>对齐</label><select id="pa"><option value="left"' + (p.align==="left"?" selected":"") + '>左</option>' +
      '<option value="center"' + (p.align==="center"?" selected":"") + '>中</option>' +
      '<option value="right"' + (p.align==="right"?" selected":"") + '>右</option></select></div></div>' +
      '<div class="fld-check" style="margin-top:6px"><input type="checkbox" id="pb"' + (p.bold?" checked":"") + '><span>加粗</span></div></div>';
  }
  if(el.type === "image"){
    html += '<div style="margin-top:6px"><label style="font-size:11px;color:var(--sub)">图片地址 URL</label>' +
      '<div class="props"><textarea id="psrc">' + esc(p.src || "") + "</textarea></div></div>";
  }
  if(el.type === "qrcode" || el.type === "barcode"){
    html += '<div style="margin-top:6px"><label style="font-size:11px;color:var(--sub)">' +
      (el.type === "qrcode" ? "二维码内容" : "条形码内容") + "</label>" +
      '<div class="props"><textarea id="pcode">' + esc(p.content || "") + "</textarea></div></div>";
  }
  if(el.type === "sign"){
    html += '<button class="btn-sm" onclick="openSign()">✍️ ' + (p.src ? "重新手写签名" : "手写签名") + "</button>" +
            (p.src ? '<button class="btn-sm" onclick="clearSignEl()">清除签名</button>' : "");
  }
  if(el.type === "table"){
    html += '<div class="prop-grid" style="margin-top:6px">' +
      '<div><label>行数</label><input id="trows" type="number" min="1" max="20" value="' + (p.rows||3) + '"></div>' +
      '<div><label>列数</label><input id="tcols" type="number" min="1" max="10" value="' + (p.cols||3) + '"></div></div>' +
      '<div class="empty-tip" style="margin-top:6px">双击表格单元格可直接填写内容</div>';
  }
  if(el.type === "autotable"){
    html += '<div class="empty-tip" style="margin-top:6px">显示字段在下方「自动表格·显示字段」勾选；<br>预览时自动填入全部记录并按每页行数分页。</div>';
  }
  html += '<button class="btn-del" id="delBtn">🗑 删除该元素</button>';
  box.innerHTML = html;

  function bind(id, fn){ var n = $(id); if(n) n.addEventListener("input", fn); }
  bind("px", function(){ el.x = +$("px").value || 0; renderEditor(); saveState(); });
  bind("py", function(){ el.y = +$("py").value || 0; renderEditor(); saveState(); });
  bind("pw", function(){ el.w = Math.max(3, +$("pw").value || 3); renderEditor(); saveState(); });
  bind("ph", function(){ el.h = Math.max(2, +$("ph").value || 2); renderEditor(); saveState(); });
  bind("pc", function(){ p.content = $("pc").value; saveState(); });
  bind("pfs", function(){ p.fontSize = +$("pfs").value || 14; renderEditor(); saveState(); });
  bind("pa", function(){ p.align = $("pa").value; renderEditor(); saveState(); });
  bind("pb", function(){ p.bold = $("pb").checked; renderEditor(); saveState(); });
  bind("psrc", function(){ p.src = $("psrc").value; renderEditor(); saveState(); });
  bind("pcode", function(){ p.content = $("pcode").value; renderEditor(); saveState(); });
  bind("trows", function(){ p.rows = Math.max(1, +$("trows").value || 3); renderEditor(); saveState(); });
  bind("tcols", function(){ p.cols = Math.max(1, +$("tcols").value || 3); renderEditor(); saveState(); });
  $("delBtn").addEventListener("click", function(){
    var t = curTpl();
    t.elements = t.elements.filter(function(x){ return x.id !== el.id; });
    state.selectedId = null;
    renderEditor(); renderProps(); saveState();
  });
}
function clearSignEl(){
  var el = selected();
  if(el){ delete el.props.src; renderEditor(); renderProps(); saveState(); }
}

/* 字段 chips */
(function(){
  var row = $("fieldChips");
  FIELDS.forEach(function(f){
    var b = document.createElement("button");

/* 自动表格字段勾选 */
function renderAutoFields(){
  var box = $("autoTableFields");
  box.innerHTML = "";
  FIELDS.forEach(function(f){
    var lb = document.createElement("label");
    lb.className = "fld-check";
    lb.innerHTML = '<input type="checkbox"' + (state.autoFields.indexOf(f) >= 0 ? " checked" : "") + '><span>' + esc(f) + "</span>";
    lb.querySelector("input").addEventListener("change", function(ev){
      if(ev.target.checked){ if(state.autoFields.indexOf(f) < 0) state.autoFields.push(f); }
      else state.autoFields = state.autoFields.filter(function(x){ return x !== f; });
      renderEditor(); saveState();
    });
    box.appendChild(lb);
  });
}

/* =====================================================================
 * 预览 & 打印
 * 有「自动表格」→ 整表排版：每页 perPage 行，其余元素每页重复（页眉/页脚）
 * 无「自动表格」→ 单条排版：每条记录一页，{{字段}} 逐条替换
 * ===================================================================== */
function buildPages(){
  var dim = paperSizeMM();
  var margin = +$("margin").value || 15;
  var per = +$("perPage").value || 8;
  var area = $("printArea");
  area.innerHTML = "";

  var hasAuto = els().some(function(e){ return e.type === "autotable"; });
  var pageList = [];
  if(hasAuto){
    for(var i = 0; i < RECORDS.length; i += per){
      pageList.push({ rows: RECORDS.slice(i, i + per), no: pageList.length + 1 });
    }
    if(pageList.length === 0) pageList.push({ rows: [], no: 1 });
  }else{
    RECORDS.forEach(function(rec, i){ pageList.push({ data: rec, no: i + 1 }); });
  }
  var total = pageList.length;

  pageList.forEach(function(pg){
    var paper = document.createElement("div");
    paper.className = "paper";
    paper.style.width = dim.w + "mm";
    paper.style.height = dim.h + "mm";
    paper.style.padding = margin + "mm";
    paper.innerHTML = '<span class="paper-label">第 ' + pg.no + " 页 / 共 " + total + " 页</span>";

    els().forEach(function(el){
      var div = document.createElement("div");
      div.className = "el el-" + el.type;
      div.style.left = el.x + "mm"; div.style.top = el.y + "mm";
      div.style.width = el.w + "mm"; div.style.height = el.h + "mm";

      if(el.type === "autotable"){
        var fs = state.autoFields;
        var html = "<table><tr>" + fs.map(function(f){ return "<th>" + esc(f) + "</th>"; }).join("") + "</tr>";
        pg.rows.forEach(function(rec){
          html += "<tr>" + fs.map(function(f){ return "<td>" + esc(rec[f] || "") + "</td>"; }).join("") + "</tr>";
        });
        for(var pad = pg.rows.length; pad < per; pad++){
          html += "<tr>" + fs.map(function(){ return "<td>&nbsp;</td>"; }).join("") + "</tr>";
        }
        div.innerHTML = html + "</table>";
      }else{
        div.innerHTML = renderElContent(el, pg.data || {});
      }
      paper.appendChild(div);
    });
    area.appendChild(paper);
  });
  paintCodes(area);
}

function doPrint(){
  buildPages();
  window.print();
}

/* =====================================================================
 * 初始化
 * ===================================================================== */
["paperSize","orient","margin","perPage"].forEach(function(id){
  $(id).addEventListener("change", function(){ renderEditor(); saveState(); });
});

loadState();
renderTplSelect();
renderEditor();
renderProps();
renderAutoFields();
