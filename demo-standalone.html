<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>排版打印 · 对标官方界面版</title>
<style>
  :root{
    --ink:#1f2329; --sub:#646a73; --line:#e5e6eb; --blue:#3370ff;
    --blue-bg:#f0f4ff; --card:#f7f8fa; --danger:#d83931; --green:#0f8a4d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:var(--ink); font-size:14px; background:#eef0f3; overflow:hidden;}

  /* ===== 整体布局 ===== */
  .app{display:flex; height:100%;}
  .side{width:250px; flex-shrink:0; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column;}
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .content{flex:1; overflow:auto; padding:24px; background:#e2e5ea;}

  /* ===== 左侧模板面板 ===== */
  .side-search{padding:12px 12px 6px;}
  .side-search input{width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;}
  .side-scroll{flex:1; overflow-y:auto; padding:4px 12px;}
  .group-title{font-size:12px; color:var(--sub); margin:12px 0 6px; font-weight:600;}
  .tpl-item{display:flex; align-items:center; gap:7px; padding:7px 9px; border-radius:7px; font-size:13px; cursor:pointer; margin-bottom:2px;}
  .tpl-item:hover{background:var(--card);}
  .tpl-item.on{background:var(--blue-bg); color:var(--blue); font-weight:600;}
  .tpl-item .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tpl-item .del{font-size:11px; color:var(--sub); border:none; background:none; cursor:pointer; display:none;}
  .tpl-item:hover .del{display:block;}
  .tpl-item .del:hover{color:var(--danger);}
  .side-foot{padding:10px 12px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px;}
  .btn-create{width:100%; background:var(--blue); color:#fff; border:none; padding:9px; border-radius:8px; font-size:13.5px; cursor:pointer; font-weight:600;}
  .btn-create:hover{background:#2860e1;}
  .side-empty{font-size:12px; color:#a0a6b0; padding:4px 9px 8px;}

  /* ===== 顶部操作栏 ===== */
  .topbar{height:46px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; padding:0 14px; flex-shrink:0;}
  .topbar .sep{border-left:1px solid var(--line); height:20px; margin:0 4px;}
  .topbar select{padding:4px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; max-width:170px;}
  .paper-chip{font-size:12.5px; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 9px; cursor:pointer; background:#fff;}
  .paper-chip:hover{border-color:var(--blue); color:var(--blue);}
  .rec-chip{font-size:12.5px; color:var(--sub); white-space:nowrap;}
  .rec-chip b{color:var(--ink); font-weight:600;}
  .link-btn{border:none; background:none; color:var(--blue); font-size:12.5px; cursor:pointer; padding:4px 8px; white-space:nowrap;}
  .link-btn:hover{text-decoration:underline;}
  .link-btn.batch-on{color:#fff; background:var(--green); border-radius:6px; text-decoration:none;}
  .tb-btn{border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 13px; font-size:13px; cursor:pointer; white-space:nowrap;}
  .tb-btn:hover{border-color:var(--blue); color:var(--blue);}
  .tb-btn.primary{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600;}
  .tb-btn.primary:hover{background:#2860e1;}
  .save-hint{font-size:11.5px; color:#a0a6b0;}

  /* ===== 纸张设置弹出 ===== */
  .pop-wrap{position:relative;}
  .popover{position:absolute; top:36px; left:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.14); padding:12px; width:230px; z-index:50; display:none;}
  .popover.show{display:block;}
  .popover label{font-size:11px; color:var(--sub); display:block; margin:7px 0 2px;}
  .popover select,.popover input{width:100%; padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:12.5px;}
  .popover .row2{display:flex; gap:6px;}

  /* ===== 纸张与元素 ===== */
  .paper{background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.15); position:relative; margin:0 auto 24px; overflow:hidden;}
  .paper-label{position:absolute; top:5px; right:10px; font-size:11px; color:#c0c4cc; z-index:1;}
  .el{position:absolute; cursor:move; user-select:none;}
  .el.selected{outline:2px solid var(--blue); outline-offset:1px;}
  .el .content{width:100%; height:100%; overflow:hidden; pointer-events:none; padding:0; flex:none; background:transparent;}
  .el .content.editable{pointer-events:auto;}
  .el .content[contenteditable]:focus{outline:1px dashed var(--blue);}
  .resize-handle{position:absolute; right:-5px; bottom:-5px; width:10px; height:10px; background:var(--blue); border:2px solid #fff; border-radius:50%; cursor:nwse-resize; display:none; z-index:5;}
  .el.selected .resize-handle{display:block;}
  .el-text .content{line-height:1.6; word-break:break-all; white-space:pre-wrap;}
  .el-line{border-top:1.5px solid #333;}
  .el-table table{width:100%; height:100%; border-collapse:collapse;}
  .el-table td,.el-table th{border:1px solid #444; padding:2px 4px; font-size:12px;}
  .el-autotable table{width:100%; border-collapse:collapse;}
  .el-autotable td,.el-autotable th{border:1px solid #444; padding:3px 5px; font-size:12px; text-align:left;}
  .el-autotable th{background:#f2f2f2;}
  .el-img img{width:100%; height:100%; object-fit:contain;}
  .el-qr,.el-bar{background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .qr-box img{width:100%; height:100%;}
  .lib-fallback{font-size:10.5px; color:#999; text-align:center; padding:4px;}
  .el .el-sign{display:flex; align-items:center; justify-content:center;}
  .sign-zone{width:100%; height:100%; border:1.5px dashed #999; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#999; font-size:11px;}
  .sign-zone img{width:100%; height:100%; object-fit:contain;}

  /* ===== v0.6 编辑器（对齐官方）===== */
  .name-input{border:1px solid transparent; background:transparent; font-size:13px; font-weight:600; padding:4px 8px; border-radius:6px; width:170px; color:var(--ink);}
  .name-input:hover{background:var(--card);}
  .name-input:focus{outline:none; border-color:var(--blue); background:#fff;}
  .tb-btn:disabled{opacity:.35; cursor:not-allowed;}
  .tb-btn:disabled:hover{border-color:var(--line); color:var(--ink);}
  .tip-box{background:#fff8e6; color:#8a6116; font-size:11.5px; line-height:1.5; border-radius:8px; padding:8px 10px; margin:2px 0 10px;}
  .comp-list{display:flex; flex-direction:column; gap:4px;}
  .comp-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; font-size:13px; cursor:grab; user-select:none; border:1px solid transparent;}
  .comp-item:hover{background:var(--card); border-color:var(--line);}
  .comp-item .ic{width:20px; text-align:center;}
  .canvas-top{display:flex; align-items:center; gap:6px; padding:0 0 10px; font-size:11.5px; color:#a0a6b0;}
  .more-btn{border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer; color:var(--sub); white-space:nowrap;}
  .more-btn:hover{border-color:var(--blue); color:var(--blue);}
  .popover.right{left:auto; right:0;}
  .pop-item{display:block; width:100%; text-align:left; border:none; background:none; padding:7px 8px; font-size:12.5px; cursor:pointer; border-radius:6px; color:var(--ink);}
  .pop-item:hover{background:var(--card);}
  .fld-chip{display:inline-block; border:1px solid #f0473f; color:#f0473f; background:#fff7f6; border-radius:4px; padding:0 4px; margin:0 1px; font-size:.9em; line-height:1.5; white-space:nowrap;}
  .chip-caret{font-style:normal; opacity:.65; font-size:.85em;}
  .grow{flex:1;}

  /* ===== v0.7 浮动工具条 + 拖动手柄 ===== */
  .float-bar{position:absolute; z-index:20;}
  .fb-wrap{position:relative; display:flex; align-items:center; gap:2px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.14); padding:3px;}
  .fb-btn{border:none; background:none; padding:4px 8px; font-size:12px; cursor:pointer; border-radius:6px; white-space:nowrap; color:var(--ink);}
  .fb-btn:hover{background:var(--card);}
  .fb-btn.fb-del:hover{background:#fff1f0; color:var(--danger);}
  .fb-pop{position:absolute; top:34px; left:0; display:none; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.14); padding:6px; z-index:30; min-width:110px;}
  .fb-pop.show{display:block;}
  .fb-pop .mi{display:block; width:100%; text-align:left; border:none; background:none; padding:6px 9px; font-size:12px; cursor:pointer; border-radius:5px; color:var(--ink); white-space:nowrap;}
  .fb-pop .mi:hover{background:var(--card);}
  .fb-pos{min-width:160px; padding:8px;}
  .fb-pos.show{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .fb-pos label{font-size:10.5px; color:var(--sub); display:block;}
  .fb-pos input{width:100%; padding:3px 6px; border:1px solid var(--line); border-radius:5px; font-size:12px;}
  .drag-handle{
    position:absolute; left:-8mm; top:0; width:6mm; height:6mm;
    display:none; align-items:center; justify-content:center;
    background:#fff; border:1px solid var(--blue); color:var(--blue);
    border-radius:4px; cursor:grab; font-size:11px; z-index:6;
    box-shadow:0 1px 4px rgba(0,0,0,.15); user-select:none;
  }
  .el.selected .drag-handle{display:flex;}

  /* ===== 编辑模式左侧 ===== */
  .ed-sec{padding:0 12px;}
  .sec-title{font-size:12px; color:var(--sub); margin:12px 0 6px; font-weight:600;}
  .palette{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .pal-item{border:1px solid var(--line); border-radius:8px; padding:8px 4px; text-align:center; font-size:12.5px; cursor:grab; background:#fff; user-select:none;}
  .pal-item:hover{border-color:var(--blue); color:var(--blue); background:var(--blue-bg);}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-size:11px; background:var(--blue-bg); color:var(--blue); border:none; padding:3px 8px; border-radius:99px; cursor:pointer;}
  .prop-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px;}
  .prop-grid label{font-size:10.5px; color:var(--sub); display:block;}
  .prop-grid input,.prop-grid select{width:100%; padding:3px 6px; border:1px solid var(--line); border-radius:5px; font-size:12px;}
  .props textarea{width:100%; height:56px; padding:5px; border:1px solid var(--line); border-radius:5px; font-size:12px; font-family:inherit; resize:vertical;}
  .btn-sm{border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px; font-size:12px; cursor:pointer; width:100%; margin-top:6px;}
  .btn-del{width:100%; margin-top:8px; background:#fff1f0; color:var(--danger); border:1px solid #ffccc7; padding:6px; border-radius:6px; cursor:pointer; font-size:12px;}
  .empty-tip{font-size:12px; color:var(--sub); padding:8px; background:var(--card); border-radius:6px; line-height:1.6;}
  .fld-check{display:flex; align-items:center; gap:5px; font-size:12px; padding:2px 0;}

  /* ===== 签名弹窗 ===== */
  .modal-mask{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:99;}
  .modal-mask.show{display:flex;}
  .modal{background:#fff; border-radius:12px; padding:20px; width:660px; max-width:92vw;}
  .modal h3{font-size:15px; margin-bottom:10px;}
  #signCanvas{border:1.5px dashed var(--blue); border-radius:8px; background:#fff; cursor:crosshair; width:100%; touch-action:none;}
  .modal .row{display:flex; gap:10px; margin-top:12px; justify-content:flex-end;}
  .modal button{border:none; border-radius:8px; padding:8px 20px; font-size:13px; cursor:pointer;}
  .modal .clear{background:var(--card); color:var(--ink);}
  .modal .ok{background:var(--blue); color:#fff; font-weight:600;}

  /* ===== 打印 ===== */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important; position:absolute; left:0; top:0; width:100%;}
    body{overflow:visible; background:#fff;}
    .paper{box-shadow:none; margin:0; page-break-after:always;}
    .paper:last-child{page-break-after:auto;}
    .paper-label{display:none;}
    .el{outline:none !important;}
    .resize-handle{display:none !important;}
    .float-bar, .drag-handle{display:none !important;}
    @page{margin:0;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="sidePanel"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- 签名弹窗 -->
<div class="modal-mask" id="signModal">
  <div class="modal">
    <h3>✍️ 手写签名（鼠标按住拖动书写）</h3>
    <canvas id="signCanvas" width="600" height="220"></canvas>
    <div class="row">
      <button class="clear" onclick="clearSign()">清 空</button>
      <button class="clear" onclick="closeSign()">取 消</button>
      <button class="ok" onclick="saveSign()">确 认</button>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
/* =====================================================================
 * 模拟数据（真实插件来自飞书 SDK）
 * ===================================================================== */
var FIELDS = ["明细序号","商品名称","型号","规格","数量","单价","金额","备注","出货日期"];
var RECORDS = [
  {"明细序号":"ITEM-001","商品名称":"不锈钢螺栓","型号":"GB5783","规格":"M8×30","数量":"400","单价":"0.8","金额":"320","备注":"镀锌","出货日期":"2026-09-28"},
  {"明细序号":"ITEM-002","商品名称":"工业润滑脂","型号":"NLGI-2","规格":"2号锂基","数量":"20","单价":"45","金额":"900","备注":"桶装","出货日期":"2026-09-29"},
  {"明细序号":"ITEM-003","商品名称":"数控刀具","型号":"CNMG","规格":"TCMT090204","数量":"50","单价":"28","金额":"1400","备注":"","出货日期":"2026-09-30"},
  {"明细序号":"ITEM-004","商品名称":"切削液","型号":"SF-101","规格":"半合成 20L","数量":"6","单价":"260","金额":"1560","备注":"","出货日期":"2026-10-02"},
  {"明细序号":"ITEM-005","商品名称":"液压油缸","型号":"MOB","规格":"HSG63/35","数量":"4","单价":"860","金额":"3440","备注":"带行程","出货日期":"2026-10-08"},
  {"明细序号":"ITEM-006","商品名称":"轴承","型号":"6205","规格":"深沟球","数量":"60","单价":"12","金额":"720","备注":"","出货日期":"2026-10-09"}
];
var SIZES = { A4:[210,297], A5:[148,210], letter:[216,279] };
var MM = 3.78;

/* =====================================================================
 * 内置模板
 * ===================================================================== */
function presetDingdan(){ // 记录模板：订购单（对齐官方示例样式）
  return [
    { id:"p1", type:"text", x:15, y:10, w:100, h:12, props:{ content:"{{公司名称}}", fontSize:22, bold:true } },
    { id:"p2", type:"text", x:140, y:14, w:55, h:8, props:{ content:"订购单编号：", fontSize:11 } },
    { id:"p3", type:"line", x:15, y:26, w:180, h:2, props:{} },
    { id:"p4", type:"text", x:15, y:32, w:60, h:8, props:{ content:"订单编号：{{明细序号}}", fontSize:12 } },
    { id:"p5", type:"text", x:15, y:44, w:90, h:22, props:{ content:"供方：\n联系人：　电话：", fontSize:12 } },
    { id:"p6", type:"text", x:110, y:44, w:85, h:22, props:{ content:"发货地址：\n发货日期：{{出货日期}}", fontSize:12 } },
    { id:"p7", type:"text", x:15, y:70, w:60, h:8, props:{ content:"订购明细", fontSize:13, bold:true } },
    { id:"p8", type:"autotable", x:15, y:80, w:180, h:50, props:{} },
    { id:"p9", type:"text", x:120, y:134, w:75, h:8, props:{ content:"合计：{{SUM(金额)}}", fontSize:12, bold:true, align:"right" } },
    { id:"p10", type:"sign", x:130, y:146, w:60, h:20, props:{} },
    { id:"p11", type:"text", x:15, y:172, w:180, h:14, props:{ content:"如有任何疑问或需要进一步的信息，请随时与我们联系，感谢您的信任与合作！", fontSize:10 } },
    { id:"p12", type:"text", x:15, y:186, w:180, h:8, props:{ content:"联系人：王大锤　联系电话：19888888888　点火科技公司", fontSize:10 } }
  ];
}
function presetBaojia(){ // 记录模板：报价单
  return [
    { id:"p1", type:"text", x:70, y:10, w:70, h:12, props:{ content:"销 售 报 价 单", fontSize:22, bold:true, align:"center" } },
    { id:"p2", type:"text", x:15, y:28, w:90, h:9, props:{ content:"客户名称：{{商品名称}}", fontSize:12 } },
    { id:"p3", type:"text", x:130, y:28, w:65, h:9, props:{ content:"报价日期：{{出货日期}}", fontSize:12 } },
    { id:"p4", type:"autotable", x:15, y:42, w:180, h:55, props:{} },
    { id:"p5", type:"line", x:15, y:104, w:180, h:2, props:{} },
    { id:"p6", type:"text", x:15, y:110, w:110, h:18, props:{ content:"报价说明：\n1. 以上价格含税含运费；\n2. 有效期 30 天。", fontSize:11 } },
    { id:"p7", type:"sign", x:135, y:108, w:60, h:22, props:{} }
  ];
}
function presetChuku(){ // 视图模板：产品出库单
  return [
    { id:"p1", type:"text", x:70, y:12, w:70, h:12, props:{ content:"产 品 出 库 单", fontSize:22, bold:true, align:"center" } },
    { id:"p2", type:"text", x:15, y:30, w:120, h:10, props:{ content:"日期：{{出货日期}}　经手人：________", fontSize:12 } },
    { id:"p3", type:"autotable", x:15, y:45, w:180, h:60, props:{} },
    { id:"p4", type:"text", x:95, y:110, w:100, h:8, props:{ content:"合计：{{SUM(金额)}}", fontSize:12, bold:true, align:"right" } },
    { id:"p5", type:"text", x:15, y:122, w:100, h:8, props:{ content:"审核：________", fontSize:12 } },
    { id:"p6", type:"qrcode", x:170, y:118, w:25, h:25, props:{ content:"https://njswd.github.io/feishu-print-plugin/" } }
  ];
}

/* =====================================================================
 * 状态
 * ===================================================================== */
var state = {
  view: "preview",            // preview | edit
  templates: [
    { id:"t1", name:"订购单", kind:"record", elements: presetDingdan() },
    { id:"t2", name:"销售报价单", kind:"record", elements: presetBaojia() },
    { id:"t3", name:"产品出库单", kind:"view", elements: presetChuku() }
  ],
  currentTpl: "t1",
  currentRec: 0,
  batch: false,
  selectedId: null,
  autoFields: ["明细序号","商品名称","型号","规格","数量","单价","金额","出货日期"],
  paper: "A4", landscape: false, margin: 15, perPage: 8
};
var nextId = 100;

function $(id){ return document.getElementById(id); }
function curTpl(){ return state.templates.find(function(t){ return t.id === state.currentTpl; }); }
function els(){ var t = curTpl(); return t ? t.elements : []; }
function selected(){ return els().find(function(e){ return e.id === state.selectedId; }) || null; }
function curRec(){ return RECORDS[state.currentRec] || RECORDS[0]; }
function recLabel(rec){ return rec["明细序号"] || rec["商品名称"] || "记录"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function nextElId(){
  var max = 0;
  state.templates.forEach(function(t){ t.elements.forEach(function(e){ var n=parseInt(e.id.slice(1)); if(n>max) max=n; }); });
  return "e" + Math.max(max+1, nextId++);
}

/* =====================================================================
 * 保存 / 加载
 * ===================================================================== */
var SAVE_KEY = "print-plugin-layout-v4";
function saveState(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      templates: state.templates, currentTpl: state.currentTpl, autoFields: state.autoFields,
      paper: state.paper, landscape: state.landscape, margin: state.margin, perPage: state.perPage
    }));
  }catch(e){}
}
function loadState(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d.templates && d.templates.length){
      state.templates = d.templates;
      state.currentTpl = d.currentTpl || d.templates[0].id;
    }
    if(d.autoFields) state.autoFields = d.autoFields;
    if(d.paper) state.paper = d.paper;
    if(d.landscape) state.landscape = d.landscape;
    if(d.margin) state.margin = d.margin;
    if(d.perPage) state.perPage = d.perPage;
    var max = 0;
    state.templates.forEach(function(t){ t.elements.forEach(function(e){ var n=parseInt(e.id.slice(1)); if(n>max) max=n; }); });
    nextId = max + 1;
  }catch(e){}
}

/* =====================================================================
 * 渲染工具
 * ===================================================================== */
var TEXT_LIKE = ["text","free","article","attach"];
var COMPONENTS = [
  {type:"text", icon:"🅰", label:"文本"},
  {type:"table", icon:"▦", label:"表格"},
  {type:"image", icon:"🖼️", label:"图片"},
  {type:"attach", icon:"📎", label:"附件"},
  {type:"qrcode", icon:"⊟", label:"二维码"},
  {type:"barcode", icon:"🕋", label:"条形码"},
  {type:"line", icon:"━", label:"水平线"},
  {type:"free", icon:"✥", label:"自由拖动元素"},
  {type:"article", icon:"📋", label:"文章区块"},
  {type:"autotable", icon:"🔁", label:"自动表格"},
  {type:"sign", icon:"✍️", label:"签名"}
];

function renderTpl(tpl, data, rows){
  return String(tpl).replace(/\{\{(.*?)\}\}/g, function(_, raw){
    var m = raw.match(/^SUM\((.+)\)$/);
    if(m){
      var name = m[1].trim();
      var list = rows && rows.length ? rows : (data ? [data] : []);
      var sum = 0;
      list.forEach(function(r){ var n = parseFloat(r[name]); if(!isNaN(n)) sum += n; });
      return String(Math.round(sum * 100) / 100);
    }
    var v = data ? data[raw.trim()] : undefined;
    return (v === undefined || v === null) ? "" : String(v);
  });
}
/* 编辑态：把 {{字段}} 渲染为红色 chip */
function chipLabel(f){
  var m = f.match(/^SUM\((.+)\)$/);
  return m ? "求和 · " + m[1].trim() : f;
}
function richEditHTML(raw){
  return esc(raw || "").replace(/\{\{(.*?)\}\}/g, function(_, f){
    return '<span class="fld-chip" data-raw="'+esc(f)+'">'+esc(chipLabel(f))+' <i class="chip-caret">⌄</i></span>';
  });
}
/* 退出编辑时把 DOM 还原为原始文本（chip → {{字段}}） */
function richToRaw(node){
  var out = "";
  node.childNodes.forEach(function(n){
    if(n.nodeType === 3){ out += n.nodeValue || ""; }
    else if(n.nodeType === 1){
      var el = n;
      if(el.classList.contains("fld-chip")){ out += "{{" + (el.getAttribute("data-raw") || el.textContent) + "}}"; }
      else if(el.tagName === "BR"){ out += "\n"; }
      else if(el.tagName === "DIV" || el.tagName === "P"){ out += (out ? "\n" : "") + richToRaw(el); }
      else { out += richToRaw(el); }
    }
  });
  return out;
}
function renderElContent(el, data, rows, edit){
  var p = el.props || {};
  var style = "font-size:" + (p.fontSize || 14) + "px;" + (p.bold ? "font-weight:700;" : "") + "text-align:" + (p.align || "left") + ";";
  switch(el.type){
    case "text":
    case "free":
    case "article":
    case "attach":
      if(edit) return '<div class="content editable" style="'+style+'">' + richEditHTML(p.content || "双击编辑文本") + "</div>";
      return '<div class="content" style="'+style+'">' + esc(renderTpl(p.content || "", data, rows)) + "</div>";
    case "line":
      return '<div class="content el-line"></div>';
    case "image":
      return '<div class="content el-img"><img src="'+esc(p.src||"")+'" alt=""></div>';
    case "qrcode":
      return '<div class="content el-qr" data-qr="'+esc(p.content||"")+'"></div>';
    case "barcode":
      return '<div class="content el-bar" data-bar="'+esc(p.content||"")+'"></div>';
    case "sign":
      if(p.src) return '<div class="content el-sign"><div class="sign-zone"><img src="'+p.src+'"></div></div>';
      return '<div class="content el-sign"><div class="sign-zone">签名区</div></div>';
    case "table":
      var rows = p.rows||3, cols = p.cols||3, html = "<table>";
      for(var r=0;r<rows;r++){
        html += "<tr>";
        for(var c=0;c<cols;c++){
          var cell = (p.cells && p.cells[r] && p.cells[r][c]) || "";
          var cellHtml = edit ? richEditHTML(cell) : esc(renderTpl(cell, data, rows));
          html += '<td style="text-align:'+(p.align||"left")+'">'+cellHtml+"</td>";
        }
        html += "</tr>";
      }
      return '<div class="content el-table" style="'+style+'">'+html+"</div>";
    case "autotable":
      var fs = state.autoFields;
      var head = "<tr>"+fs.map(function(f){ return "<th>"+esc(f)+"</th>"; }).join("")+"</tr>";
      var body = RECORDS.slice(0,2).map(function(rec){
        return "<tr>"+fs.map(function(f){ return "<td>"+esc(rec[f]||"")+"</td>"; }).join("")+"</tr>";
      }).join("");
      return '<div class="content el-autotable"><table>'+head+body+'<tr><td colspan="'+fs.length+'" style="color:#bbb;text-align:center">…预览时自动填入全部记录…</td></tr></table></div>';
  }
  return "";
}
function paintCodes(rootEl){
  if(!window.QRCode || !window.JsBarcode){
    rootEl.querySelectorAll(".content.el-qr,.content.el-bar").forEach(function(box){
      if(!box.querySelector(".lib-fallback"))
        box.innerHTML = '<div class="lib-fallback">'+(box.classList.contains("el-qr")?"二维码":"条形码")+'<br>(需联网)</div>';
    });
    return;
  }
  rootEl.querySelectorAll(".content.el-qr").forEach(function(box){
    var txt = box.getAttribute("data-qr") || " ";
    box.innerHTML = "";
    try{ new QRCode(box, { text:txt, width:200, height:200, correctLevel:QRCode.CorrectLevel.M }); }catch(e){}
  });
  rootEl.querySelectorAll(".content.el-bar").forEach(function(box){
    var txt = box.getAttribute("data-bar") || "0000000000";
    box.innerHTML = '<svg class="bar-svg"></svg>';
    try{ JsBarcode(box.querySelector(".bar-svg"), txt, { format:"CODE128", displayValue:true, height:60, fontSize:12, margin:0 }); }catch(e){}
  });
}
function paperSizeMM(){
  var s = SIZES[state.paper];
  return state.landscape ? { w:s[1], h:s[0] } : { w:s[0], h:s[1] };
}

/* =====================================================================
 * 分页逻辑
 * record 模板：单条=当前记录一页；批量=全部记录各一页
 * view 模板：含自动表格=按每页行数分页（元素每页重复）；否则单页
 * ===================================================================== */
function buildPageList(){
  var t = curTpl();
  var list = [];
  if(t.kind === "record"){
    if(state.batch){
      RECORDS.forEach(function(rec, i){ list.push({ data: rec, no: i+1 }); });
    }else{
      list.push({ data: curRec(), no: 1 });
    }
  }else{
    var hasAuto = t.elements.some(function(e){ return e.type === "autotable"; });
    if(hasAuto){
      for(var i=0;i<RECORDS.length;i+=state.perPage){
        list.push({ rows: RECORDS.slice(i, i+state.perPage), no: list.length+1 });
      }
      if(list.length===0) list.push({ rows: [], no: 1 });
    }else{
      list.push({ data: null, no: 1 });
    }
  }
  return list;
}

function buildPages(area){
  var dim = paperSizeMM();
  area.innerHTML = "";
  var pages = buildPageList();
  var total = pages.length;

  pages.forEach(function(pg){
    var paper = document.createElement("div");
    paper.className = "paper";
    paper.style.width = dim.w+"mm"; paper.style.height = dim.h+"mm"; paper.style.padding = state.margin+"mm";
    paper.innerHTML = '<span class="paper-label">第 '+pg.no+" 页 / 共 "+total+" 页</span>";

    els().forEach(function(el){
      var div = document.createElement("div");
      div.className = "el el-"+el.type;
      div.style.left = el.x+"mm"; div.style.top = el.y+"mm";
      div.style.width = el.w+"mm"; div.style.height = el.h+"mm";
      if(el.type === "autotable"){
        var fs = state.autoFields;
        var rows = pg.rows || [];
        var html = "<table><tr>"+fs.map(function(f){ return "<th>"+esc(f)+"</th>"; }).join("")+"</tr>";
        rows.forEach(function(rec){
          html += "<tr>"+fs.map(function(f){ return "<td>"+esc(rec[f]||"")+"</td>"; }).join("")+"</tr>";
        });
        if(curTpl().kind === "view"){
          for(var pad=rows.length; pad<state.perPage; pad++){
            html += "<tr>"+fs.map(function(){ return "<td>&nbsp;</td>"; }).join("")+"</tr>";
          }
        }
        div.innerHTML = html + "</table>";
      }else{
        div.innerHTML = renderElContent(el, pg.data || null, pg.rows || [], false);
      }
      paper.appendChild(div);
    });
    area.appendChild(paper);
  });
  paintCodes(area);
}

function createTpl(){

    { id: nextElId(), type:"text", x:70, y:15, w:70, h:12, props:{ content:name, fontSize:22, bold:true, align:"center" } }
  ]};
  state.templates.push(t);
  state.currentTpl = t.id;
  state.selectedId = null; state.batch = false;
  saveState();

function delTpl(id){

  if(!confirm("确定删除模板「"+t.name+"」？")) return;
  state.templates = state.templates.filter(function(x){ return x.id !== id; });
  if(state.currentTpl === id) state.currentTpl = state.templates[0].id;
  state.selectedId = null;
  renderAll(); saveState();
}

/* ===== 撤销 / 重做 / 清空（v0.6）===== */
var hist = { stack: [], idx: -1 };
function resetHist(){ hist.stack = [JSON.stringify(els())]; hist.idx = 0; }
function commit(){
  var s = JSON.stringify(els());
  if(hist.stack[hist.idx] === s) return;
  hist.stack = hist.stack.slice(0, hist.idx + 1);
  hist.stack.push(s);
  if(hist.stack.length > 50) hist.stack.shift();
  hist.idx = hist.stack.length - 1;
}
function undo(){
  if(hist.idx <= 0) return;
  hist.idx--;
  curTpl().elements = JSON.parse(hist.stack[hist.idx]);
  state.selectedId = null;
  renderAll(); saveState();
}
function redo(){
  if(hist.idx >= hist.stack.length - 1) return;
  hist.idx++;
  curTpl().elements = JSON.parse(hist.stack[hist.idx]);
  state.selectedId = null;
  renderAll(); saveState();
}
function clearAll(){
  if(!els().length) return;
  if(!confirm("确定清空当前模板的所有元素？")) return;
  curTpl().elements = [];
  state.selectedId = null;
  commit(); renderAll(); saveState();
}

    '<span class="popover right" id="morePop">' +
    '<label>纸张</label><select id="epPaper"><option value="A4">A4</option><option value="A5">A5</option><option value="letter">Letter</option></select>' +
    '<div class="row2"><div style="flex:1"><label>方向</label><select id="epOrient"><option value="p">纵向</option><option value="l">横向</option></select></div>' +
    '<div style="flex:1"><label>边距mm</label><input id="epMargin" type="number" value="'+state.margin+'" min="5" max="40"></div></div>' +
    (t0.kind==="view" ? '<label>自动表格每页行数</label><input id="epPer" type="number" value="'+state.perPage+'" min="1" max="30">' : "") +
    '<button class="pop-item" style="margin-top:8px" onclick="exportHtml()">⬇ 导出 HTML</button>' +
    '<button class="pop-item" onclick="showGuide()">📖 使用指南</button>' +
    '</span></span></div>' +
    '<div class="paper" id="editorPaper"></div>';
  var epP = $("epPaper"); if(epP){ epP.value = state.paper; epP.addEventListener("change", function(){ state.paper = this.value; renderAll(); saveState(); }); }
  var epO = $("epOrient"); if(epO){ epO.value = state.landscape ? "l" : "p"; epO.addEventListener("change", function(){ state.landscape = this.value === "l"; renderAll(); saveState(); }); }
  var epM = $("epMargin"); if(epM){ epM.addEventListener("input", function(){ state.margin = +this.value || 15; renderAll(); saveState(); }); }
  var epR = $("epPer"); if(epR){ epR.addEventListener("input", function(){ state.perPage = +this.value || 8; renderAll(); saveState(); }); }
  var paper = $("editorPaper");
  var dim = paperSizeMM();
  paper.style.width = dim.w+"mm"; paper.style.height = dim.h+"mm"; paper.style.padding = state.margin+"mm";

  els().forEach(function(el){
    var div = document.createElement("div");
    div.className = "el el-"+el.type+(el.id===state.selectedId?" selected":"");
    div.style.left = el.x+"mm"; div.style.top = el.y+"mm";
    div.style.width = el.w+"mm"; div.style.height = el.h+"mm";
    div.dataset.id = el.id;
    div.innerHTML = renderElContent(el, curTpl().kind==="record" ? curRec() : null, [], true) + '<div class="drag-handle" title="拖动移动">✥</div><div class="resize-handle"></div>';
    paper.appendChild(div);

    if(TEXT_LIKE.indexOf(el.type) >= 0){
      var ce = div.querySelector(".content");
      if(ce){
        /* 双击进入编辑；单击不拦截冒泡，保证可选中/可拖动 */
        ce.addEventListener("dblclick", function(ev){
          ev.stopPropagation();
          ce.contentEditable = "true";
          ce.focus();
        });
        ce.addEventListener("mousedown", function(ev){
          if(ce.contentEditable === "true" || ce === document.activeElement) ev.stopPropagation();
        });
        ce.addEventListener("blur", function(){
          var raw = richToRaw(ce);
          ce.contentEditable = "false";
          if(raw !== el.props.content){ el.props.content = raw; commit(); renderProps(); }
          saveState();
        });
      }
    }
    if(el.type === "table"){
      div.querySelectorAll(".el-table td").forEach(function(td, idx){
        td.addEventListener("dblclick", function(ev){
          ev.stopPropagation();
          td.contentEditable = "true";
          td.focus();
        });
        td.addEventListener("mousedown", function(ev){
          if(td.contentEditable === "true" || td === document.activeElement) ev.stopPropagation();
        });
        td.addEventListener("blur", function(){
          var rows = el.props.rows||3, cols = el.props.cols||3;
          var r = Math.floor(idx/cols), cc = idx%cols;
          var old = (el.props.cells && el.props.cells[r] && el.props.cells[r][cc]) || "";
          var raw = richToRaw(td);
          td.contentEditable = "false";
          if(raw !== old){
            el.props.cells = el.props.cells||{};
            el.props.cells[r] = el.props.cells[r]||{};
            el.props.cells[r][cc] = raw;
            commit();
          }
          saveState();
        });
      });
    }
    bindElDrag(div, el);
    paintCodes(div);
  });
  buildFloatBar();
  renderProps();
}

/* =====================================================================
 * 编辑器：拖拽 / 浮动工具条 / 属性 / 签名
 * ===================================================================== */
var dragType = null;
function bindElDrag(div, el){
  function startMove(ev){
    if(ev.target.classList.contains("resize-handle")) return;
    state.selectedId = el.id;
    ev.stopPropagation();
    document.querySelectorAll(".el.selected").forEach(function(n){ n.classList.remove("selected"); });
    div.classList.add("selected");
    buildFloatBar();
    renderProps();
    var startX = ev.clientX, startY = ev.clientY, ox = el.x, oy = el.y;
    function onMove(e){
      el.x = ox + (e.clientX-startX)/MM; el.y = oy + (e.clientY-startY)/MM;
      div.style.left = el.x+"mm"; div.style.top = el.y+"mm";
      moveFloatBar(el);
    }
    function onUp(){
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      commit(); saveState();
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }
  div.addEventListener("mousedown", startMove);
  var dh = div.querySelector(".drag-handle");
  if(dh) dh.addEventListener("mousedown", startMove);
  var handle = div.querySelector(".resize-handle");
  if(handle){
    handle.addEventListener("mousedown", function(ev){
      ev.stopPropagation(); ev.preventDefault();
      var startX = ev.clientX, startY = ev.clientY, ow = el.w, oh = el.h;
      function onMove(e){
        el.w = Math.max(5, ow+(e.clientX-startX)/MM); el.h = Math.max(3, oh+(e.clientY-startY)/MM);
        div.style.width = el.w+"mm"; div.style.height = el.h+"mm";
        moveFloatBar(el);
      }
      function onUp(){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        commit(); saveState();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  }
}

/* ===== v0.7 浮动工具条 ===== */
var floatBar = null;
function buildFloatBar(){
  floatBar = null;
  var sel = selected();
  if(!sel) return;
  var paper = $("editorPaper");
  var bar = document.createElement("div");
  bar.className = "float-bar";
  bar.style.left = sel.x + "mm";
  bar.style.top = (sel.y > 12 ? sel.y - 9 : sel.y + sel.h + 2) + "mm";
  bar.innerHTML =
    '<div class="fb-wrap">' +
    '<button class="fb-btn" data-act="align">≡ 对齐 ▾</button>' +
    '<button class="fb-btn" data-act="edit">✏️ 编辑</button>' +
    '<button class="fb-btn" data-act="pos">⌖ 位置</button>' +
    '<button class="fb-btn" data-act="copy">⧉ 复制</button>' +
    '<button class="fb-btn fb-del" data-act="del" title="删除">🗑</button>' +
    '<div class="fb-pop" id="alignPop">' +
    '<button class="mi" data-align="left">⇤ 左对齐</button>' +
    '<button class="mi" data-align="hcenter">↔ 水平居中</button>' +
    '<button class="mi" data-align="right">⇥ 右对齐</button>' +
    '<button class="mi" data-align="top">⇧ 顶对齐</button>' +
    '<button class="mi" data-align="vcenter">↕ 垂直居中</button>' +
    '<button class="mi" data-align="bottom">⇩ 底对齐</button>' +
    '</div>' +
    '<div class="fb-pop fb-pos" id="posPop">' +
    '<div><label>X(mm)</label><input id="fbx" type="number" value="'+sel.x.toFixed(1)+'"></div>' +
    '<div><label>Y(mm)</label><input id="fby" type="number" value="'+sel.y.toFixed(1)+'"></div>' +
    '<div><label>宽(mm)</label><input id="fbw" type="number" value="'+sel.w.toFixed(1)+'"></div>' +
    '<div><label>高(mm)</label><input id="fbh" type="number" value="'+sel.h.toFixed(1)+'"></div>' +
    '</div></div>';
  paper.appendChild(bar);
  floatBar = bar;

  bar.addEventListener("mousedown", function(ev){ ev.stopPropagation(); });
  bar.querySelectorAll(".fb-btn").forEach(function(b){
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      var act = b.dataset.act;
      if(act === "align"){ $("alignPop").classList.toggle("show"); $("posPop").classList.remove("show"); }
      else if(act === "pos"){ $("posPop").classList.toggle("show"); $("alignPop").classList.remove("show"); }
      else if(act === "edit") fbEdit(sel);
      else if(act === "copy") fbCopy(sel);
      else if(act === "del") fbDelete(sel);
    });
  });
  $("alignPop").querySelectorAll(".mi").forEach(function(mi){
    mi.addEventListener("click", function(ev){ ev.stopPropagation(); alignSel(sel, mi.dataset.align); });
  });
  [["fbx","x"],["fby","y"],["fbw","w"],["fbh","h"]].forEach(function(pair){
    var n = $(pair[0]); if(!n) return;
    n.addEventListener("input", function(){
      var v = +this.value || 0;
      if(pair[1] === "w") v = Math.max(3, v);
      if(pair[1] === "h") v = Math.max(2, v);
      sel[pair[1]] = v;
      var elDiv = paper.querySelector('.el[data-id="'+sel.id+'"]');
      if(elDiv){ elDiv.style.left = sel.x+"mm"; elDiv.style.top = sel.y+"mm"; elDiv.style.width = sel.w+"mm"; elDiv.style.height = sel.h+"mm"; }
      bar.style.left = sel.x + "mm";
      bar.style.top = (sel.y > 12 ? sel.y - 9 : sel.y + sel.h + 2) + "mm";
    });
    n.addEventListener("change", function(){ commit(); saveState(); });
  });
}
function moveFloatBar(el){
  if(!floatBar) return;
  floatBar.style.left = el.x + "mm";
  floatBar.style.top = (el.y > 12 ? el.y - 9 : el.y + el.h + 2) + "mm";
}
function innerArea(){
  var s = SIZES[state.paper];
  return { w: (state.landscape ? s[1] : s[0]) - state.margin*2, h: (state.landscape ? s[0] : s[1]) - state.margin*2 };
}
function alignSel(el, dir){
  var a = innerArea();
  if(dir==="left") el.x = 0;
  if(dir==="hcenter") el.x = Math.round((a.w - el.w)/2*10)/10;
  if(dir==="right") el.x = Math.round((a.w - el.w)*10)/10;
  if(dir==="top") el.y = 0;
  if(dir==="vcenter") el.y = Math.round((a.h - el.h)/2*10)/10;
  if(dir==="bottom") el.y = Math.round((a.h - el.h)*10)/10;
  commit(); renderContent(); saveState();
}
function fbEdit(el){
  if(TEXT_LIKE.indexOf(el.type) >= 0){
    var ce = document.querySelector('.el[data-id="'+el.id+'"] .content');
    if(ce){ ce.contentEditable = "true"; ce.focus(); }
  }else{
    $("posPop").classList.add("show"); $("alignPop").classList.remove("show");
  }
}
function fbCopy(el){
  var clone = JSON.parse(JSON.stringify(el));
  clone.id = nextElId();
  clone.x = Math.round((el.x + 5)*10)/10;
  clone.y = Math.round((el.y + 5)*10)/10;
  els().push(clone);
  state.selectedId = clone.id;
  commit(); renderContent(); saveState();
}
function fbDelete(el){
  var t = curTpl();
  t.elements = t.elements.filter(function(x){ return x.id !== el.id; });
  state.selectedId = null;
  commit(); renderContent(); saveState();
}

document.addEventListener("dragover", function(e){
  if($("editorPaper") && state.view === "edit") e.preventDefault();
});
document.addEventListener("drop", function(e){
  var paper = $("editorPaper");
  if(!paper || state.view !== "edit" || !dragType) return;
  e.preventDefault();
  var rect = paper.getBoundingClientRect();
  var cs = getComputedStyle(paper);
  var pad = parseFloat(cs.paddingLeft)/MM;
  var innerW = (rect.width - parseFloat(cs.paddingLeft)*2)/MM;
  var innerH = (rect.height - parseFloat(cs.paddingTop)*2)/MM;
  var defaults = {
    text:{ w:60,h:10,props:{content:"双击编辑文本",fontSize:14,bold:false,align:"left"} },
    line:{ w:80,h:2,props:{} },
    table:{ w:80,h:30,props:{rows:3,cols:3,cells:{}} },
    autotable:{ w:180,h:60,props:{} },
    image:{ w:40,h:30,props:{src:"https://dummyimage.com/300x200/e5e6eb/646a73.png&text=Image"} },
    qrcode:{ w:25,h:25,props:{content:"https://example.com"} },
    barcode:{ w:45,h:14,props:{content:"20260927001"} },
    sign:{ w:60,h:22,props:{} },
    attach:{ w:50,h:10,props:{content:"📎 附件：{{附件}}",fontSize:12} },
    free:{ w:60,h:10,props:{content:"自由拖动元素",fontSize:14} },
    article:{ w:100,h:24,props:{content:"在这里输入文字，输入 {{字段}} 快速插入字段",fontSize:12} }
  };
  var d = defaults[dragType];
  var el = { id: nextElId(), type: dragType,
    x: Math.max(0, Math.min((e.clientX-rect.left)/MM - pad, innerW-d.w)),
    y: Math.max(0, Math.min((e.clientY-rect.top)/MM - pad, innerH-d.h)),
    w: d.w, h: d.h, props: JSON.parse(JSON.stringify(d.props)) };
  els().push(el);
  state.selectedId = el.id;
  renderContent();
  commit();
  saveState();
  dragType = null;
});

document.addEventListener("mousedown", function(e){
  var paper = $("editorPaper");
  if(paper && e.target === paper){ state.selectedId = null; renderContent(); }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Delete" && state.selectedId && state.view === "edit"){
    var tag = document.activeElement && document.activeElement.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||document.activeElement.isContentEditable) return;
    var t = curTpl();
    t.elements = t.elements.filter(function(el){ return el.id !== state.selectedId; });
    state.selectedId = null;
    renderContent(); commit(); saveState();
  }
});

function renderProps(){
  var box = $("propsBox");
  if(!box) return;
  var el = selected();
  if(!el){ box.innerHTML = '<div class="empty-tip">点击纸张上的元素进行设置；双击文本可直接编辑；选中后按 Delete 删除。</div>'; return; }
  var p = el.props || {};
  var html = '<div class="prop-grid">' +
    '<div><label>X(mm)</label><input id="px" type="number" value="'+el.x.toFixed(1)+'"></div>' +
    '<div><label>Y(mm)</label><input id="py" type="number" value="'+el.y.toFixed(1)+'"></div>' +
    '<div><label>宽(mm)</label><input id="pw" type="number" value="'+el.w.toFixed(1)+'"></div>' +
    '<div><label>高(mm)</label><input id="ph" type="number" value="'+el.h.toFixed(1)+'"></div></div>';
  if(TEXT_LIKE.indexOf(el.type)>=0){
    html += '<div class="props" style="margin-top:6px"><textarea id="pc">'+esc(p.content||"")+'</textarea></div>' +
      '<div class="prop-grid" style="margin-top:6px">' +
      '<div><label>字号</label><input id="pfs" type="number" value="'+(p.fontSize||14)+'"></div>' +
      '<div><label>对齐</label><select id="pa"><option value="left"'+(p.align==="left"?" selected":"")+'>左</option><option value="center"'+(p.align==="center"?" selected":"")+'>中</option><option value="right"'+(p.align==="right"?" selected":"")+'>右</option></select></div></div>' +
      '<div class="fld-check" style="margin-top:4px"><input type="checkbox" id="pb"'+(p.bold?" checked":"")+'><span>加粗</span></div>' +
      '<div class="empty-tip" style="margin-top:4px">文本中输入 {{字段}} 引用数据，{{SUM(金额)}} 求和</div>';
  }
  if(el.type==="image") html += '<div class="props" style="margin-top:6px"><textarea id="psrc" placeholder="图片URL">'+esc(p.src||"")+"</textarea></div>";
  if(el.type==="qrcode"||el.type==="barcode") html += '<div class="props" style="margin-top:6px"><textarea id="pcode">'+esc(p.content||"")+"</textarea></div>";
  if(el.type==="sign") html += '<button class="btn-sm" onclick="openSign()">✍️ '+(p.src?"重新手写签名":"手写签名")+"</button>" +
    (p.src?'<button class="btn-sm" onclick="clearSignEl()">清除签名</button>':"");
  if(el.type==="table"){
    html += '<div class="prop-grid" style="margin-top:6px">' +
      '<div><label>行数</label><input id="trows" type="number" min="1" max="20" value="'+(p.rows||3)+'"></div>' +
      '<div><label>列数</label><input id="tcols" type="number" min="1" max="10" value="'+(p.cols||3)+'"></div></div>' +
      '<div class="empty-tip" style="margin-top:6px">双击单元格填写；支持 {{字段}} 变量</div>';
  }
  if(el.type==="autotable") html += '<div class="empty-tip" style="margin-top:6px">显示字段在左侧「自动表格·显示字段」勾选</div>';
  html += '<button class="btn-del" id="delBtn">🗑 删除该元素</button>';
  box.innerHTML = html;

  function bind(id, fn){ var n = $(id); if(n) n.addEventListener("input", fn); }
  bind("px", function(){ el.x = +$("px").value||0; renderContent(); commit(); saveState(); });
  bind("py", function(){ el.y = +$("py").value||0; renderContent(); commit(); saveState(); });
  bind("pw", function(){ el.w = Math.max(3, +$("pw").value||3); renderContent(); commit(); saveState(); });
  bind("ph", function(){ el.h = Math.max(2, +$("ph").value||2); renderContent(); commit(); saveState(); });
  bind("pc", function(){ p.content = $("pc").value; commit(); saveState(); });
  bind("pfs", function(){ p.fontSize = +$("pfs").value||14; renderContent(); commit(); saveState(); });
  bind("pa", function(){ p.align = $("pa").value; renderContent(); commit(); saveState(); });
  bind("pb", function(){ p.bold = $("pb").checked; renderContent(); commit(); saveState(); });
  bind("psrc", function(){ p.src = $("psrc").value; renderContent(); commit(); saveState(); });
  bind("pcode", function(){ p.content = $("pcode").value; renderContent(); commit(); saveState(); });
  bind("trows", function(){ p.rows = Math.max(1,+$("trows").value||3); renderContent(); commit(); saveState(); });
  bind("tcols", function(){ p.cols = Math.max(1,+$("tcols").value||3); renderContent(); commit(); saveState(); });
  $("delBtn").addEventListener("click", function(){
    var t = curTpl();
    t.elements = t.elements.filter(function(x){ return x.id !== el.id; });
    state.selectedId = null;
    renderContent(); commit(); saveState();
  });
}
function clearSignEl(){
  var el = selected();
  if(el){ delete el.props.src; renderContent(); saveState(); }
}

/* 签名板 */
var signingEl = null, drawing = false;
function openSign(){
  var el = selected();
  if(!el || el.type !== "sign") return;
  signingEl = el;
  $("signModal").classList.add("show");
  var c = $("signCanvas");
  c.getContext("2d").clearRect(0,0,c.width,c.height);
}
function closeSign(){ $("signModal").classList.remove("show"); signingEl = null; }
function clearSign(){ var c = $("signCanvas"); c.getContext("2d").clearRect(0,0,c.width,c.height); }
function saveSign(){
  if(!signingEl) return closeSign();
  signingEl.props.src = $("signCanvas").toDataURL("image/png");
  closeSign(); renderContent(); commit(); saveState();
}
(function(){
  var c = $("signCanvas"), ctx = c.getContext("2d");
  ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#1f2329";
  function pos(e){
    var r = c.getBoundingClientRect();
    return { x:(e.clientX-r.left)*c.width/r.width, y:(e.clientY-r.top)*c.height/r.height };
  }
  c.addEventListener("pointerdown", function(e){ drawing=true; c.setPointerCapture(e.pointerId); var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
  c.addEventListener("pointermove", function(e){ if(!drawing) return; var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  c.addEventListener("pointerup", function(){ drawing=false; });
})();

/* =====================================================================
 * 打印 & 总渲染
 * ===================================================================== */
function doPrint(){
  var area = $("printArea");
  buildPages(area);
  window.print();
}
function renderAll(){
  renderSide();
  renderTopbar();
  renderContent();
}

loadState();
renderAll();
</script>
